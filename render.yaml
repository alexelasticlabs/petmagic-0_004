# Render Blueprint for the PetMagic staging environment.
# This file is safe to commit: secret values are marked with sync: false.
# Create production as a separate Blueprint/env after staging is verified.

previews:
  generation: off

databases:
  - name: petmagic-staging-db
    region: frankfurt
    plan: basic-1gb
    ipAllowList: []
    databaseName: petmagic_db
    user: petmagic_user
    postgresMajorVersion: "16"

envVarGroups:
  - name: petmagic-staging-shared
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging
      - key: DOTNET_ENVIRONMENT
        value: Staging
      - key: BACKEND_PUBLIC_BASE_URL
        value: https://api.staging.petmagic.app
      - key: TEMPLATES_STORAGE_PROVIDER
        value: R2
      - key: TEMPLATES_AI_PROVIDER
        value: Fal
      - key: TEMPLATES_WATERMARK_ENABLED
        value: "true"
      - key: PETMAGIC_LOCAL_SMOKE_FAST_FAKE_COMPLETION
        value: "false"
      - key: PETMAGIC_QA_FIXTURES_ENABLED
        value: "false"
      - key: STORE_ACCOUNT_BINDING_MODE
        value: compatibility
      - key: GENERATION_GLOBAL_MAX_CONCURRENT
        value: "8"
      - key: GENERATION_IMAGE_RESERVED_CONCURRENT
        value: "3"
      - key: GENERATION_IMAGE_PROTECTED_CONCURRENT
        value: "3"
      - key: GENERATION_IMAGE_MAX_CONCURRENT
        value: "7"
      - key: GENERATION_VIDEO_RESERVED_CONCURRENT
        value: "2"
      - key: GENERATION_VIDEO_MAX_CONCURRENT
        value: "4"
      - key: GENERATION_VIDEO_BORROW_MAX_CONCURRENT
        value: "2"
      - key: GENERATION_ENABLE_ELASTIC_LANE_BORROWING
        value: "true"
      - key: GENERATION_ALLOW_VIDEO_BORROW_WHEN_IMAGE_QUEUE_EMPTY
        value: "true"
      - key: GENERATION_ALLOW_VIDEO_BORROW_IMAGE_WAIT_BELOW_SECONDS
        value: "120"
      - key: GENERATION_VIDEO_BORROW_RELEASE_MODE
        value: natural_completion
      - key: GENERATION_BORROWED_VIDEO_MAX_AGE_SECONDS
        value: "0"
      - key: GENERATION_BORROWING_PRIORITY_TIERS
        value: premium,privileged,admin,free
      - key: GENERATION_VIDEO_PREPROCESSING_MAX_CONCURRENT
        value: "1"
      - key: GENERATION_QUEUE_MAX_SIZE
        value: "1000"
      - key: GENERATION_ESTIMATED_IMAGE_SECONDS
        value: "90"
      - key: GENERATION_ESTIMATED_VIDEO_SECONDS
        value: "420"
      - key: GENERATION_ESTIMATED_VIDEO_PREPROCESSING_SECONDS
        value: "90"
      - key: GENERATION_FREE_IMAGE_MAX_WAIT_SECONDS
        value: "1800"
      - key: GENERATION_PREMIUM_IMAGE_MAX_WAIT_SECONDS
        value: "900"
      - key: GENERATION_PRIVILEGED_IMAGE_MAX_WAIT_SECONDS
        value: "900"
      - key: GENERATION_FREE_VIDEO_MAX_WAIT_SECONDS
        value: "3600"
      - key: GENERATION_PREMIUM_VIDEO_MAX_WAIT_SECONDS
        value: "1800"
      - key: GENERATION_PRIVILEGED_VIDEO_MAX_WAIT_SECONDS
        value: "1800"
      - key: GENERATION_PRIORITY_AGING_INTERVAL_SECONDS
        value: "60"
      - key: GENERATION_PRIORITY_AGING_BOOST
        value: "500"
      - key: GENERATION_CANCEL_QUEUED_ENABLED
        value: "true"
      - key: TEMPLATES_REALTIME_EVENT_RETENTION_MINUTES
        value: "60"
      - key: TEMPLATES_REALTIME_EVENT_CLEANUP_INTERVAL_MINUTES
        value: "10"
      - key: TEMPLATES_REALTIME_EVENT_CLEANUP_BATCH_SIZE
        value: "1000"
      - key: FAL_PROVIDER_CONCURRENCY_LIMIT
        value: "10"
      - key: FAL_PROVIDER_RESERVED_CONCURRENCY
        value: "2"
      - key: FAL_PROVIDER_BALANCE_LOW_THRESHOLD_USD
        value: "100"
      - key: FAL_PROVIDER_BALANCE_CRITICAL_THRESHOLD_USD
        value: "25"
      - key: GENERATION_PROVIDER_MAX_RPM
        value: "60"
      - key: GENERATION_MAX_ATTEMPTS
        value: "3"
      - key: GENERATION_JOB_LOCK_TIMEOUT_MS
        value: "900000"
      - key: GENERATION_ORPHAN_QUEUED_TIMEOUT_MS
        value: "120000"
      - key: GENERATION_REFUND_RETRY_DELAY_MS
        value: "30000"
      - key: Templates__MaxRefundAttempts
        value: "5"
      - key: Templates__Fal__StartTimeoutSeconds
        value: "120"
      - key: Templates__Fal__ImageMaxPollingAttempts
        value: "180"
      - key: Templates__Fal__ImagePreprocessingMaxPollingAttempts
        value: "180"
      - key: Templates__Fal__VideoMaxPollingAttempts
        value: "300"

services:
  - type: web
    name: petmagic-staging-api
    runtime: docker
    region: frankfurt
    plan: standard
    branch: master
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    domains:
      - api.staging.petmagic.app
    disk:
      name: petmagic-staging-api-data
      mountPath: /var/petmagic
      sizeGB: 10
    buildFilter:
      paths:
        - global.json
        - Directory.Build.props
        - Directory.Packages.props
        - shared/**
        - Dockerfile.api
        - render.yaml
        - scripts/docker/**
        - src/**
    envVars:
      - fromGroup: petmagic-staging-shared
      - key: PORT
        value: "5000"
      - key: ASPNETCORE_HTTP_PORTS
        value: "5000"
      - key: ExternalAuth__MobileRedirectScheme
        value: petmagic-staging
      - key: ForwardedHeaders__Enabled
        value: "true"
      - key: ForwardedHeaders__TrustAll
        value: "true"
      - key: ForwardedHeaders__ForwardLimit
        value: "1"
      - key: APP_VOLUME_DIRS
        value: /var/petmagic
      - key: DataProtection__KeysPath
        value: /var/petmagic/DataProtection-Keys
      - key: StaticFiles__ExtraWebRootPath
        value: /var/petmagic/wwwroot
      - key: Identity__AvatarStorage__PublicBaseUrl
        value: https://api.staging.petmagic.app
      - key: Identity__AvatarStorage__LocalMediaRootPath
        value: /var/petmagic/wwwroot/user-avatars
      - key: SupportChat__AttachmentStorage__PublicBaseUrl
        value: https://api.staging.petmagic.app
      - key: SupportChat__AttachmentStorage__LocalMediaRootPath
        value: /var/petmagic/wwwroot/support-attachments
      - key: Templates__PublicBaseUrl
        value: https://api.staging.petmagic.app
      - key: Templates__LocalMediaRootPath
        value: /var/petmagic/wwwroot/templates-media
      - key: Templates__GenerationWorkerEnabled
        value: "false"
      - key: Templates__TemplateOfTheDayAutoPickWorkerEnabled
        value: "true"
      - key: AllowedHosts
        value: api.staging.petmagic.app;petmagic-staging-api.onrender.com
      - key: Cors__AllowedOrigins__0
        value: https://admin.staging.petmagic.app
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: petmagic-staging-db
          property: connectionString
      - key: Jwt__SigningKey
        sync: false
      - key: FAL_PROVIDER_SPEND_DAILY_LIMIT_USD
        sync: false
      - key: FAL_AI_API_KEY
        sync: false
      - key: FAL_ACCOUNT_BILLING_ADMIN_KEY
        sync: false
      - key: FAL_EXPECTED_ACCOUNT_USERNAME
        sync: false
      - key: FAL_WEBHOOK_URL
        value: https://api.staging.petmagic.app/api/templates/generations/fal/webhook
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: STRIPE_TEST_SECRET_KEY
        sync: false
      - key: STRIPE_TEST_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_TEST_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CHECKOUT_SUCCESS_URL
        value: https://admin.staging.petmagic.app/payments/success?session_id={CHECKOUT_SESSION_ID}
      - key: STRIPE_CHECKOUT_CANCEL_URL
        value: https://admin.staging.petmagic.app/payments/cancel
      - key: STRIPE_BILLING_PORTAL_RETURN_URL
        value: https://admin.staging.petmagic.app/payments/return
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: com.petmagic.app.staging
      - key: GOOGLE_PLAY_PREMIUM_MONTHLY_PRODUCT_ID
        sync: false
      - key: GOOGLE_PLAY_PREMIUM_YEARLY_PRODUCT_ID
        sync: false
      - key: GOOGLE_PLAY_PRIVATE_KEY_PEM
        sync: false
      - key: GOOGLE_PLAY_ENVIRONMENT
        value: sandbox
      - key: GOOGLE_PLAY_PUBSUB_AUDIENCE
        sync: false
      - key: GOOGLE_PLAY_PUBSUB_EXPECTED_EMAIL
        sync: false
      - key: APP_STORE_SHARED_SECRET
        sync: false
      - key: APP_STORE_BUNDLE_ID
        value: com.petmagic.app.staging
      - key: APP_STORE_PREMIUM_MONTHLY_PRODUCT_ID
        sync: false
      - key: APP_STORE_PREMIUM_YEARLY_PRODUCT_ID
        sync: false
      - key: APP_STORE_ENVIRONMENT
        value: sandbox
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_AUDIENCES
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_SECRET
        sync: false
      - key: APPLE_AUDIENCES
        sync: false
      - key: APPLE_AUTHORIZATION_ENDPOINT
        value: https://appleid.apple.com/auth/authorize
      - key: APPLE_TOKEN_ENDPOINT
        value: https://appleid.apple.com/auth/token
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_USE_SSL
        value: "true"
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_FROM_NAME
        value: PetMagic
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false

  - type: worker
    name: petmagic-staging-generation-worker
    runtime: docker
    region: frankfurt
    plan: standard
    branch: master
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile.generation-worker
    dockerContext: .
    maxShutdownDelaySeconds: 300
    numInstances: 4
    buildFilter:
      paths:
        - global.json
        - Directory.Build.props
        - Directory.Packages.props
        - shared/**
        - Dockerfile.generation-worker
        - render.yaml
        - scripts/docker/**
        - src/**
    envVars:
      - fromGroup: petmagic-staging-shared
      - key: APP_VOLUME_DIRS
        value: /var/petmagic
      - key: Templates__GenerationWorkerEnabled
        value: "true"
      - key: ECONOMY_RECONCILIATION_ENABLED
        value: "false"
      - key: ECONOMY_PUSH_OUTBOX_DISPATCHER_ENABLED
        value: "false"
      - key: Templates__MediaCleanupWorkerEnabled
        value: "false"
      - key: Templates__TemplateOfTheDayAutoPickWorkerEnabled
        value: "false"
      - key: Templates__MaxConcurrentJobsPerWorker
        value: "2"
      - key: Templates__GenerationWorkerPollIntervalMilliseconds
        value: "500"
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: petmagic-staging-db
          property: connectionString
      - key: Jwt__SigningKey
        sync: false
      - key: FAL_PROVIDER_SPEND_DAILY_LIMIT_USD
        sync: false
      - key: FAL_AI_API_KEY
        sync: false
      - key: FAL_WEBHOOK_URL
        value: https://api.staging.petmagic.app/api/templates/generations/fal/webhook
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: STRIPE_TEST_SECRET_KEY
        sync: false
      - key: STRIPE_TEST_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_TEST_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CHECKOUT_SUCCESS_URL
        value: https://admin.staging.petmagic.app/payments/success?session_id={CHECKOUT_SESSION_ID}
      - key: STRIPE_CHECKOUT_CANCEL_URL
        value: https://admin.staging.petmagic.app/payments/cancel
      - key: STRIPE_BILLING_PORTAL_RETURN_URL
        value: https://admin.staging.petmagic.app/payments/return
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: com.petmagic.app.staging
      - key: GOOGLE_PLAY_PREMIUM_MONTHLY_PRODUCT_ID
        sync: false
      - key: GOOGLE_PLAY_PREMIUM_YEARLY_PRODUCT_ID
        sync: false
      - key: GOOGLE_PLAY_PRIVATE_KEY_PEM
        sync: false
      - key: GOOGLE_PLAY_ENVIRONMENT
        value: sandbox
      - key: GOOGLE_PLAY_PUBSUB_AUDIENCE
        sync: false
      - key: GOOGLE_PLAY_PUBSUB_EXPECTED_EMAIL
        sync: false
      - key: APP_STORE_SHARED_SECRET
        sync: false
      - key: APP_STORE_BUNDLE_ID
        value: com.petmagic.app.staging
      - key: APP_STORE_PREMIUM_MONTHLY_PRODUCT_ID
        sync: false
      - key: APP_STORE_PREMIUM_YEARLY_PRODUCT_ID
        sync: false
      - key: APP_STORE_ENVIRONMENT
        value: sandbox
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false

  - type: web
    name: petmagic-staging-admin-web
    runtime: docker
    region: frankfurt
    plan: starter
    branch: master
    autoDeployTrigger: checksPass
    dockerfilePath: ./apps/admin-web/Dockerfile
    dockerContext: ./apps/admin-web
    healthCheckPath: /ru
    maxShutdownDelaySeconds: 60
    domains:
      - admin.staging.petmagic.app
    buildFilter:
      paths:
        - apps/admin-web/**
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://api.staging.petmagic.app
      - key: INTERNAL_API_BASE_URL
        value: https://api.staging.petmagic.app
      - key: ALLOW_LOCALHOST_API_BASE_URL_IN_PRODUCTION
        value: "false"
      - key: NEXT_PUBLIC_ALLOW_LOCALHOST_API_BASE_URL_IN_PRODUCTION
        value: "false"
      - key: ADMIN_MEDIA_ORIGINS
        sync: false
      - key: PETMAGIC_APP_DEEP_LINK_SCHEME
        value: petmagic-staging
