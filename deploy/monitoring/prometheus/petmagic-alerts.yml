groups:
  - name: petmagic-api-sli
    interval: 30s
    rules:
      - record: api_response_time_p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, route, method) (
              rate(request_duration_seconds_bucket[5m])
            )
          )

      - alert: PetMagicApiP95High
        expr: api_response_time_p95 > 1
        for: 10m
        labels:
          severity: warning
          service: petmagic-api
        annotations:
          summary: "PetMagic API p95 latency is high"
          description: "Route {{ $labels.route }} {{ $labels.method }} has p95 latency above 1s for 10 minutes."

      - alert: PetMagicApiErrorRateHigh
        expr: |
          sum(rate(request_errors_total[5m]))
            / clamp_min(sum(rate(request_duration_seconds_count[5m])), 1)
            > 0.05
        for: 10m
        labels:
          severity: warning
          service: petmagic-api
        annotations:
          summary: "PetMagic API error rate is high"
          description: "HTTP 4xx/5xx or exception rate is above 5% for 10 minutes."

  - name: petmagic-generation
    interval: 30s
    rules:
      - alert: PetMagicGenerationQueueBacklog
        expr: sum(generation_jobs_queued) > 50
        for: 10m
        labels:
          severity: warning
          service: petmagic-generation-worker
        annotations:
          summary: "Template generation queue backlog is growing"
          description: "More than 50 jobs have remained queued for 10 minutes. Check worker count, provider throttling, and PostgreSQL locks."

      - alert: PetMagicGenerationSchedulerQueueDepthHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(generation_queue_depth_bucket[5m])
            )
          ) > 75
        for: 10m
        labels:
          severity: warning
          service: petmagic-generation-worker
        annotations:
          summary: "Template generation scheduler queue depth is high"
          description: "Scheduler queue depth has stayed above 75 jobs for 10 minutes. Check image/video caps, worker count, provider throttling, and admission thresholds."

      - alert: PetMagicGenerationOldestQueuedAgeHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(generation_oldest_queued_job_age_seconds_bucket[5m])
            )
          ) > 1800
        for: 10m
        labels:
          severity: warning
          service: petmagic-generation-worker
        annotations:
          summary: "Template generation oldest queued job age is high"
          description: "The oldest queued generation has been waiting for more than 30 minutes. Check lane-specific caps, provider timeouts, and stuck workers."

      - alert: PetMagicGenerationRejectedJobsHigh
        expr: sum(rate(generation_jobs_rejected_total[10m])) > 0.2
        for: 10m
        labels:
          severity: warning
          service: petmagic-api
        annotations:
          summary: "Template generation admission rejections are elevated"
          description: "Generation jobs are being rejected before charge at an elevated rate. Check wait thresholds, queue depth, and current staging caps."

      - alert: PetMagicGenerationWaitTooLongHigh
        expr: sum by (media_type, tier) (increase(generation_jobs_rejected_total{reason="GENERATION_WAIT_TOO_LONG"}[15m])) > 5
        for: 5m
        labels:
          severity: warning
          service: petmagic-api
        annotations:
          summary: "Generation wait-too-long rejections are elevated"
          description: "GENERATION_WAIT_TOO_LONG rejections are elevated for {{ $labels.media_type }}/{{ $labels.tier }}. Check queue depth, max-wait thresholds, provider capacity, and admission settings."

      - alert: PetMagicGenerationFalTimeouts
        expr: increase(generation_fal_timeouts_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
          service: petmagic-generation-worker
        annotations:
          summary: "FAL generation timeouts detected"
          description: "At least one FAL timeout occurred in the last 15 minutes. Check media type, stage, model tags, and provider queue status."

      - alert: PetMagicGenerationQueuedWithoutCharge
        expr: increase(generation_jobs_queued_without_charge_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: petmagic-api
        annotations:
          summary: "Generation job was queued without charge"
          description: "A non-admin queued generation was found without a charge. Generation admission/charge ordering is broken or a request crashed between queue and charge."

      - alert: PetMagicGenerationRefundFailures
        expr: increase(generation_refund_failures_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
          service: petmagic-generation-worker
        annotations:
          summary: "Generation refund failures detected"
          description: "A generation refund failed. Check billing provider availability, wallet ledger writes, and RefundLastErrorCode."

      - alert: PetMagicGenerationDuplicateRefundAttempt
        expr: increase(generation_duplicate_refund_attempts_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
          service: petmagic-generation-worker
        annotations:
          summary: "Duplicate generation refund attempt detected"
          description: "A generation refund was attempted after RefundedAtUtc was already set. Check idempotency and retry concurrency."

      - alert: PetMagicFalProviderBalanceLow
        expr: fal_provider_balance_low > 0
        for: 5m
        labels:
          severity: warning
          service: petmagic-api
        annotations:
          summary: "fal.ai balance is low"
          description: "fal.ai balance is below the configured low threshold. Top up the account before launch traffic drains the remaining credits."

      - alert: PetMagicFalProviderBalanceCritical
        expr: fal_provider_balance_critical > 0
        for: 0m
        labels:
          severity: critical
          service: petmagic-api
        annotations:
          summary: "fal.ai balance is critical"
          description: "fal.ai balance is at or below the critical threshold. Generation admission should reject before charge until balance is restored."

      - alert: PetMagicFalProviderCapacityRejected
        expr: increase(fal_provider_rejected_due_to_capacity[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: petmagic-api
        annotations:
          summary: "Generation requests rejected due to fal.ai capacity guardrail"
          description: "PetMagic rejected generation requests before charge because fal.ai balance, configured concurrency, or provider capacity was unavailable."

      - alert: PetMagicFalProviderInflightNearLimit
        expr: |
          fal_provider_configured_concurrency > 0
            and fal_provider_inflight_requests
              / clamp_min(fal_provider_configured_concurrency, 1) > 0.85
        for: 10m
        labels:
          severity: warning
          service: petmagic-generation-worker
        annotations:
          summary: "fal.ai provider in-flight requests near configured concurrency"
          description: "Provider in-flight requests are above 85% of configured fal.ai concurrency for 10 minutes. Check queue wait and consider reducing admission or increasing fal.ai credits."

      - alert: PetMagicFalProviderSubmitFailures
        expr: increase(fal_provider_submit_failures[10m]) > 0
        for: 0m
        labels:
          severity: warning
          service: petmagic-generation-worker
        annotations:
          summary: "fal.ai submit failures detected"
          description: "fal.ai submit requests failed. Check model, stage, status_code tag, network path, provider dashboard, and API key permissions."

      - alert: PetMagicFalProviderQueueWaitHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(fal_provider_queue_wait_seconds_bucket[10m])
            )
          ) > 900
        for: 10m
        labels:
          severity: warning
          service: petmagic-generation-worker
        annotations:
          summary: "fal.ai provider queue wait is high"
          description: "fal.ai p95 provider queue wait is above 15 minutes. Check fal.ai dashboard, concurrency limit, and recent credit purchase state."

      - alert: PetMagicFalProviderRateLimitErrors
        expr: increase(fal_provider_rate_limit_errors[10m]) > 0
        for: 0m
        labels:
          severity: warning
          service: petmagic-generation-worker
        annotations:
          summary: "fal.ai rate limit errors detected"
          description: "fal.ai returned rate limit responses. Check configured concurrency, reserved concurrency, and provider dashboard notifications."

      - alert: PetMagicFalWebhookDeliveryFailures
        expr: increase(generation_webhook_delivery_failures_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
          service: petmagic-api
        annotations:
          summary: "fal.ai webhook delivery or payload failures detected"
          description: "Webhook payload delivery/processing failed. Check public callback URL, gateway routing, request id consistency, and API logs."

      - alert: PetMagicFalWebhookSignatureFailures
        expr: increase(generation_webhook_signature_failures_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
          service: petmagic-api
        annotations:
          summary: "fal.ai webhook signature failures detected"
          description: "fal.ai webhook signature verification failed. Check JWKS reachability, clock skew, callback headers, and whether non-fal traffic is hitting the endpoint."

      - alert: PetMagicGenerationVideoBorrowDeniedByImageBacklog
        expr: increase(generation_scheduler_video_borrow_denied_total{reason="image_backlog"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
          service: petmagic-generation-worker
        annotations:
          summary: "Video borrowing denied because image backlog needs protected capacity"
          description: "Elastic video borrowing is being denied due to image backlog. Check image queue depth, protected capacity, and whether video admission should be tightened."

      - alert: PetMagicGenerationBorrowingCapViolation
        expr: increase(generation_scheduler_borrowing_cap_violations_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: petmagic-generation-worker
        annotations:
          summary: "Generation borrowing cap violation detected"
          description: "Scheduler observed an elastic borrowing cap violation. Stop rollout and compare API/Worker scheduler fingerprints."

      - alert: PetMagicGenerationWorkerNotProcessing
        expr: |
          sum(generation_jobs_queued) > 0
            and sum(rate(generation_lifecycle_events_total{event_type=~"stage|end"}[10m])) == 0
        for: 10m
        labels:
          severity: critical
          service: petmagic-generation-worker
        annotations:
          summary: "Template generation workers are not processing queued jobs"
          description: "Jobs are queued, but no processing/completion lifecycle events were observed for 10 minutes."

      - alert: PetMagicGenerationStuckProviderQueued
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(generation_stuck_stage_age_seconds_bucket{stage="ProviderQueued"}[5m])
            )
          ) > 1800
        for: 10m
        labels:
          severity: warning
          service: petmagic-generation-worker
        annotations:
          summary: "Generation jobs are stuck in ProviderQueued"
          description: "ProviderQueued p95 age is above 30 minutes. Check fal.ai queue, provider request ids, and webhook/polling status."

      - alert: PetMagicGenerationStuckProviderProcessing
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(generation_stuck_stage_age_seconds_bucket{stage="ProviderProcessing"}[5m])
            )
          ) > 1800
        for: 10m
        labels:
          severity: warning
          service: petmagic-generation-worker
        annotations:
          summary: "Generation jobs are stuck in ProviderProcessing"
          description: "ProviderProcessing p95 age is above 30 minutes. Check fal.ai job status, polling timeout settings, and provider callbacks."

      - alert: PetMagicGenerationStuckImportingMedia
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(generation_stuck_stage_age_seconds_bucket{stage="ImportingMedia"}[5m])
            )
          ) > 600
        for: 10m
        labels:
          severity: critical
          service: petmagic-generation-worker
        annotations:
          summary: "Generation jobs are stuck importing media"
          description: "ImportingMedia p95 age is above 10 minutes. Check generated media URL expiry, R2 upload failures, and worker import logs."

      - alert: PetMagicGenerationFailuresHigh
        expr: sum(rate(generation_jobs_failed_total[10m])) > 0.1
        for: 15m
        labels:
          severity: warning
          service: petmagic-generation-worker
        annotations:
          summary: "Template generation failure rate is elevated"
          description: "Generation jobs are failing above the warning threshold."

      - alert: PetMagicGenerationRetriesExhausted
        expr: increase(generation_jobs_exhausted_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
          service: petmagic-generation-worker
        annotations:
          summary: "Template generation retries exhausted"
          description: "At least one generation job exhausted all retry attempts in the last 15 minutes."

      - alert: PetMagicGenerationRetryRateHigh
        expr: sum(rate(generation_retry_attempts_total[10m])) > 0.1
        for: 15m
        labels:
          severity: warning
          service: petmagic-generation-worker
        annotations:
          summary: "Template generation retry rate is elevated"
          description: "Generation retry attempts are elevated. Check failure_code/reason tags, provider health, and worker stability."

      - alert: PetMagicAiProviderErrorsHigh
        expr: sum(rate(ai_provider_errors_total[10m])) > 0.2
        for: 15m
        labels:
          severity: warning
          service: petmagic-generation-worker
        annotations:
          summary: "AI provider errors are elevated"
          description: "AI provider error rate is above threshold. Check provider status, model config, and rate limits."

      - alert: PetMagicGenerationMediaImportFailures
        expr: increase(generation_media_import_failures_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
          service: petmagic-generation-worker
        annotations:
          summary: "Generated media import failures detected"
          description: "Generated media import failed. Check provider result URL expiry, content type, size limits, and R2 upload path."

      - alert: PetMagicTemplatePreview404
        expr: increase(generation_preview_404_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
          service: petmagic-api
        annotations:
          summary: "Template preview/reference media returned 404"
          description: "Template content health found a preview/reference 404. Remove or fix the template before production feed exposure."

      - alert: PetMagicR2UploadFailures
        expr: increase(generation_r2_upload_failures_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
          service: petmagic-generation-worker
        annotations:
          summary: "R2 media upload failures detected"
          description: "R2 upload failed for generation/template media. Check credentials, bucket policy, endpoint URL, and object key prefix."

  - name: petmagic-economy
    interval: 30s
    rules:
      - alert: PetMagicStripeWebhookFailures
        expr: increase(stripe_webhook_failures_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: petmagic-economy
        annotations:
          summary: "Stripe webhook processing failures detected"
          description: "Stripe webhook failures occurred in the last 5 minutes. Check signature config, payload parsing, and downstream database writes."

      - alert: PetMagicWalletBalanceNegativePrevented
        expr: increase(wallet_balance_negative_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: petmagic-economy
        annotations:
          summary: "Wallet non-negative CHECK constraint fired"
          description: "A wallet mutation was rejected by the CK_economy_wallets_Balance_NonNegative constraint. The Serializable spend path should have prevented this; investigate the calling operation/source tags for a concurrency bug."

      - alert: PetMagicWebhookDuplicateStorm
        expr: sum by (provider) (increase(stripe_webhook_duplicate_total[15m])) > 10
        for: 0m
        labels:
          severity: warning
          service: petmagic-economy
        annotations:
          summary: "Elevated duplicate payment webhook deliveries"
          description: "More than 10 duplicate webhook deliveries from {{ $labels.provider }} in 15 minutes. Occasional duplicates are normal; a storm usually means our endpoint is answering non-2xx and the provider keeps retrying."

      - alert: PetMagicSandboxReceiptInProduction
        expr: increase(store_receipt_sandbox_in_prod_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
          service: petmagic-economy
        annotations:
          summary: "Sandbox store receipt rejected in production (fraud signal)"
          description: "A sandbox App Store receipt or environment-mismatched signed transaction was submitted against production. Review the user account and consider blocking repeated offenders."

      - alert: PetMagicRefundsPendingBacklog
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(refunds_pending_bucket{exhausted="false"}[5m])
            )
          ) > 5
        for: 10m
        labels:
          severity: warning
          service: petmagic-generation-worker
        annotations:
          summary: "Generation refunds are backing up"
          description: "More than 5 charged failed/cancelled generations have been awaiting refund for 10 minutes. Check billing availability and the refund retry loop."

      - alert: PetMagicRefundsRetryExhausted
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(refunds_pending_bucket{exhausted="true"}[5m])
            )
          ) > 0
        for: 5m
        labels:
          severity: critical
          service: petmagic-generation-worker
        annotations:
          summary: "Generation refunds exhausted automatic retries"
          description: "At least one charged generation exceeded MaxRefundAttempts and will never be refunded automatically. Use the admin refund endpoint to settle it manually."
