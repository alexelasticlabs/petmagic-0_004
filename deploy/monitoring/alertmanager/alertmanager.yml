global:
  resolve_timeout: 5m

route:
  receiver: petmagic-release-webhook
  group_by: ["alertname", "service_group", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: petmagic-release-webhook
    webhook_configs:
      - url: "__ALERTMANAGER_WEBHOOK_URL__"
        send_resolved: true
