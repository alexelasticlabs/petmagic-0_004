# PetMagic production Render Blueprint. Deploy manually after staging and release gates pass.
previews:
  generation: off

databases:
  - name: petmagic-production-db
    region: frankfurt
    plan: basic-1gb
    ipAllowList: []
    databaseName: petmagic_db
    user: petmagic_user
    postgresMajorVersion: "16"

envVarGroups:
  - name: petmagic-production-shared
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_ENVIRONMENT
        value: Production
      - key: BACKEND_PUBLIC_BASE_URL
        value: https://api.petgpt.app
      - key: TEMPLATES_STORAGE_PROVIDER
        value: R2
      - key: TEMPLATES_AI_PROVIDER
        value: Fal
      - key: TEMPLATES_WATERMARK_ENABLED
        value: "true"
      - key: PETMAGIC_QA_FIXTURES_ENABLED
        value: "false"
      - key: PETMAGIC_LOCAL_SMOKE_FAST_FAKE_COMPLETION
        value: "false"
      - key: STORE_ACCOUNT_BINDING_MODE
        value: compatibility
      - key: GENERATION_GLOBAL_MAX_CONCURRENT
        value: "8"
      - key: GENERATION_IMAGE_RESERVED_CONCURRENT
        value: "3"
      - key: GENERATION_IMAGE_MAX_CONCURRENT
        value: "7"
      - key: GENERATION_VIDEO_RESERVED_CONCURRENT
        value: "2"
      - key: GENERATION_VIDEO_MAX_CONCURRENT
        value: "4"
      - key: GENERATION_QUEUE_MAX_SIZE
        value: "1000"
      - key: GENERATION_MAX_ATTEMPTS
        value: "3"

services:
  - type: web
    name: petmagic-production-api
    runtime: docker
    region: frankfurt
    plan: standard
    branch: master
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    domains:
      - api.petgpt.app
    disk:
      name: petmagic-production-api-data
      mountPath: /var/petmagic
      sizeGB: 10
    buildFilter:
      paths:
        - global.json
        - Directory.Build.props
        - Directory.Packages.props
        - shared/**
        - Dockerfile.api
        - render.production.yaml
        - scripts/docker/**
        - src/**
    envVars:
      - fromGroup: petmagic-production-shared
      - key: PORT
        value: "5000"
      - key: ASPNETCORE_HTTP_PORTS
        value: "5000"
      - key: ExternalAuth__MobileRedirectScheme
        value: petmagic
      - key: ForwardedHeaders__Enabled
        value: "true"
      - key: ForwardedHeaders__TrustAll
        value: "true"
      - key: ForwardedHeaders__ForwardLimit
        value: "1"
      - key: APP_VOLUME_DIRS
        value: /var/petmagic
      - key: DataProtection__KeysPath
        value: /var/petmagic/DataProtection-Keys
      - key: StaticFiles__ExtraWebRootPath
        value: /var/petmagic/wwwroot
      - key: Identity__AvatarStorage__PublicBaseUrl
        value: https://api.petgpt.app
      - key: Identity__AvatarStorage__LocalMediaRootPath
        value: /var/petmagic/wwwroot/user-avatars
      - key: SupportChat__AttachmentStorage__PublicBaseUrl
        value: https://api.petgpt.app
      - key: SupportChat__AttachmentStorage__LocalMediaRootPath
        value: /var/petmagic/wwwroot/support-attachments
      - key: Templates__PublicBaseUrl
        value: https://api.petgpt.app
      - key: Templates__LocalMediaRootPath
        value: /var/petmagic/wwwroot/templates-media
      - key: Templates__GenerationWorkerEnabled
        value: "false"
      - key: Templates__TemplateOfTheDayAutoPickWorkerEnabled
        value: "true"
      - key: AllowedHosts
        value: api.petgpt.app;petmagic-production-api.onrender.com
      - key: Cors__AllowedOrigins__0
        value: https://admin.petgpt.app
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: petmagic-production-db
          property: connectionString
      - key: Jwt__SigningKey
        sync: false
      - key: FAL_PROVIDER_SPEND_DAILY_LIMIT_USD
        sync: false
      - key: FAL_AI_API_KEY
        sync: false
      - key: FAL_WEBHOOK_URL
        value: https://api.petgpt.app/api/templates/generations/fal/webhook
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: STRIPE_LIVE_SECRET_KEY
        sync: false
      - key: STRIPE_LIVE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_LIVE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CHECKOUT_SUCCESS_URL
        value: https://admin.petgpt.app/payments/success?session_id={CHECKOUT_SESSION_ID}
      - key: STRIPE_CHECKOUT_CANCEL_URL
        value: https://admin.petgpt.app/payments/cancel
      - key: STRIPE_BILLING_PORTAL_RETURN_URL
        value: https://admin.petgpt.app/payments/return
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: com.petmagic.app
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PLAY_PRIVATE_KEY_PEM
        sync: false
      - key: GOOGLE_PLAY_ENVIRONMENT
        value: production
      - key: GOOGLE_PLAY_PUBSUB_AUDIENCE
        sync: false
      - key: GOOGLE_PLAY_PUBSUB_EXPECTED_EMAIL
        sync: false
      - key: GOOGLE_PLAY_PREMIUM_MONTHLY_PRODUCT_ID
        sync: false
      - key: GOOGLE_PLAY_PREMIUM_YEARLY_PRODUCT_ID
        sync: false
      - key: APP_STORE_BUNDLE_ID
        value: com.petmagic.app
      - key: APP_STORE_SHARED_SECRET
        sync: false
      - key: APP_STORE_ENVIRONMENT
        value: production
      - key: APP_STORE_PREMIUM_MONTHLY_PRODUCT_ID
        sync: false
      - key: APP_STORE_PREMIUM_YEARLY_PRODUCT_ID
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_AUDIENCES
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_SECRET
        sync: false
      - key: APPLE_AUDIENCES
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_USE_SSL
        value: "true"
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_FROM_NAME
        value: PetMagic
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false

  - type: worker
    name: petmagic-production-generation-worker
    runtime: docker
    region: frankfurt
    plan: standard
    branch: master
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile.generation-worker
    dockerContext: .
    maxShutdownDelaySeconds: 300
    numInstances: 4
    buildFilter:
      paths:
        - global.json
        - Directory.Build.props
        - Directory.Packages.props
        - shared/**
        - Dockerfile.generation-worker
        - render.production.yaml
        - scripts/docker/**
        - src/**
    envVars:
      - fromGroup: petmagic-production-shared
      - key: APP_VOLUME_DIRS
        value: /var/petmagic
      - key: Templates__GenerationWorkerEnabled
        value: "true"
      - key: Templates__MediaCleanupWorkerEnabled
        value: "false"
      - key: Templates__TemplateOfTheDayAutoPickWorkerEnabled
        value: "false"
      - key: Templates__MaxConcurrentJobsPerWorker
        value: "2"
      - key: ECONOMY_RECONCILIATION_ENABLED
        value: "false"
      - key: ECONOMY_PUSH_OUTBOX_DISPATCHER_ENABLED
        value: "false"
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: petmagic-production-db
          property: connectionString
      - key: Jwt__SigningKey
        sync: false
      - key: FAL_PROVIDER_SPEND_DAILY_LIMIT_USD
        sync: false
      - key: FAL_AI_API_KEY
        sync: false
      - key: FAL_WEBHOOK_URL
        value: https://api.petgpt.app/api/templates/generations/fal/webhook
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: STRIPE_LIVE_SECRET_KEY
        sync: false
      - key: STRIPE_LIVE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_LIVE_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: com.petmagic.app
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PLAY_PRIVATE_KEY_PEM
        sync: false
      - key: GOOGLE_PLAY_ENVIRONMENT
        value: production
      - key: GOOGLE_PLAY_PUBSUB_AUDIENCE
        sync: false
      - key: GOOGLE_PLAY_PUBSUB_EXPECTED_EMAIL
        sync: false
      - key: GOOGLE_PLAY_PREMIUM_MONTHLY_PRODUCT_ID
        sync: false
      - key: GOOGLE_PLAY_PREMIUM_YEARLY_PRODUCT_ID
        sync: false
      - key: APP_STORE_BUNDLE_ID
        value: com.petmagic.app
      - key: APP_STORE_SHARED_SECRET
        sync: false
      - key: APP_STORE_ENVIRONMENT
        value: production
      - key: APP_STORE_PREMIUM_MONTHLY_PRODUCT_ID
        sync: false
      - key: APP_STORE_PREMIUM_YEARLY_PRODUCT_ID
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false

  - type: web
    name: petmagic-production-admin-web
    runtime: docker
    region: frankfurt
    plan: starter
    branch: master
    autoDeployTrigger: off
    dockerfilePath: ./apps/admin-web/Dockerfile
    dockerContext: ./apps/admin-web
    healthCheckPath: /ru
    maxShutdownDelaySeconds: 60
    domains:
      - admin.petgpt.app
    buildFilter:
      paths:
        - apps/admin-web/**
        - render.production.yaml
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://api.petgpt.app
      - key: INTERNAL_API_BASE_URL
        value: https://api.petgpt.app
      - key: ALLOW_LOCALHOST_API_BASE_URL_IN_PRODUCTION
        value: "false"
      - key: NEXT_PUBLIC_ALLOW_LOCALHOST_API_BASE_URL_IN_PRODUCTION
        value: "false"
      - key: ADMIN_MEDIA_ORIGINS
        sync: false
      - key: PETMAGIC_APP_DEEP_LINK_SCHEME
        value: petmagic
