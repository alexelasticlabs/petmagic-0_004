name: runner-maintenance

on:
  workflow_dispatch:
    inputs:
      acknowledge_ruby_toolcache_setup:
        description: Prepare the default macOS Ruby tool-cache path required by ruby/setup-ruby
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: petmagic-runner-maintenance
  cancel-in-progress: false

jobs:
  repair-ruby-toolcache:
    if: inputs.acknowledge_ruby_toolcache_setup
    runs-on: [self-hosted, macOS, petmagic-mobile]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Prepare default Ruby tool cache
        shell: bash
        run: bash scripts/ci/repair-macos-runner-toolcache.sh --prepare-ruby-toolcache
