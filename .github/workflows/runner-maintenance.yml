name: runner-maintenance

on:
  workflow_dispatch:
    inputs:
      acknowledge_runner_restart:
        description: Restart the dedicated runner after repairing its Ruby tool-cache path
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: petmagic-runner-maintenance
  cancel-in-progress: false

jobs:
  repair-ruby-toolcache:
    if: inputs.acknowledge_runner_restart
    runs-on: [self-hosted, macOS, petmagic-mobile]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Repair runner Ruby tool cache and restart the LaunchAgent
        shell: bash
        run: bash scripts/ci/repair-macos-runner-toolcache.sh --restart-runner
