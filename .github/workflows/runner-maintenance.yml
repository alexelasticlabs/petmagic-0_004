name: runner-maintenance

on:
  workflow_dispatch:
    inputs:
      acknowledge_runner_env_update:
        description: Update the dedicated runner Ruby tool-cache path without restarting the Mac service
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: petmagic-runner-maintenance
  cancel-in-progress: false

jobs:
  repair-ruby-toolcache:
    if: inputs.acknowledge_runner_env_update
    runs-on: [self-hosted, macOS, petmagic-mobile]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Repair runner Ruby tool cache configuration
        shell: bash
        run: bash scripts/ci/repair-macos-runner-toolcache.sh --configure-toolcache
