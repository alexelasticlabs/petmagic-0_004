name: payments-push-qa

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Test QA runner
        run: python -m unittest discover -s scripts/qa -p test_payments_push_qa.py
      - name: Store and notification contracts (no production credentials)
        shell: python
        run: |
          import runpy, subprocess
          qa = runpy.run_path('scripts/qa/payments_push_qa.py')
          subprocess.run(['dotnet', 'test',
            'tests/PetMagic.Modules.Identity.Tests/PetMagic.Modules.Identity.Tests.csproj',
            '--filter', qa['CONTRACT_FILTER'], '--logger', 'trx;LogFileName=contracts.trx',
            '--results-directory', 'artifacts/payments-push-ci'], check=True)
          qa['passing_tests']('artifacts/payments-push-ci/contracts.trx')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: payments-push-contracts
          path: artifacts/payments-push-ci/*.trx
