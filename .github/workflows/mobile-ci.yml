name: mobile-ci

on:
  pull_request:
    paths:
      - apps/petmagic-mobile/**
      - .github/workflows/mobile-ci.yml
  push:
    branches:
      - master
    paths:
      - apps/petmagic-mobile/**
      - .github/workflows/mobile-ci.yml

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/petmagic-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Verify generation localization completeness
        run: dart run tool/check_generation_status_l10n.dart

      - name: Verify localization completeness
        run: dart run tool/check_l10n_completeness.dart

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Generate staging Firebase packaging placeholders
        run: dart run tool/configure_firebase_smoke.dart --environment=staging

      - name: Verify release signing guard
        shell: bash
        run: |
          set +e
          output=$(flutter build appbundle \
            --flavor staging \
            --release \
            --dart-define=APP_ENVIRONMENT=staging \
            --dart-define=APP_PACKAGE_NAME=com.petmagic.app.staging \
            --dart-define=API_BASE_URL=https://api.staging.petmagic.app 2>&1)
          status=$?
          set -e

          echo "$output"

          if [ "$status" -eq 0 ]; then
            echo "Expected release signing guard to fail without key.properties"
            exit 1
          fi

          if ! echo "$output" | grep -q "Release signing is not configured"; then
            echo "Release task failed for an unexpected reason"
            exit 1
          fi

      - name: Release packaging smoke
        env:
          ORG_GRADLE_PROJECT_allowInsecureReleaseSigning: "true"
          ORG_GRADLE_PROJECT_allowPlaceholderFirebase: "true"
        run: >-
          flutter build appbundle
          --flavor staging
          --release
          --dart-define=APP_ENVIRONMENT=staging
          --dart-define=APP_PACKAGE_NAME=com.petmagic.app.staging
          --dart-define=API_BASE_URL=https://api.staging.petmagic.app

      - name: Test
        run: flutter test
