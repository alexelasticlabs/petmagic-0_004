name: mobile-ci-full

on:
  workflow_dispatch:
    inputs:
      acknowledge_full_suite:
        description: Run the complete slow regression suite (release smokes and optional device tests)
        required: true
        default: false
        type: boolean
      run_device_suite:
        description: Also run all Android emulator and iOS simulator scenarios
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite-consent:
    runs-on: [self-hosted, macOS, petmagic-mobile]
    steps:
      - name: Require explicit full-suite consent
        shell: bash
        run: |
          if [[ '${{ inputs.acknowledge_full_suite }}' != 'true' ]]; then
            echo 'The full suite is opt-in. Use mobile-fast-check for normal work.' >&2
            exit 1
          fi

  quality-and-android:
    needs: full-suite-consent
    runs-on: [self-hosted, macOS, petmagic-mobile]
    defaults:
      run:
        working-directory: apps/petmagic-mobile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.5'
          cache: false
      - name: Configure persistent local dependency caches
        shell: bash
        run: |
          cache_root="$HOME/.cache/petmagic-ci"
          mkdir -p "$cache_root/pub" "$cache_root/gradle"
          {
            echo "PUB_CACHE=$cache_root/pub"
            echo "GRADLE_USER_HOME=$cache_root/gradle"
          } >> "$GITHUB_ENV"
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate localization
        run: flutter gen-l10n
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - name: Verify localization catalogs
        run: |
          dart tool/check_generation_status_l10n.dart
          dart tool/check_l10n_completeness.dart
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Verify architecture boundaries
        run: flutter test test/mobile_architecture_test.dart
      - name: Verify responsive and accessible UI contracts
        run: >-
          flutter test --concurrency=1
          test/widget_test.dart
          test/welcome_compact_golden_test.dart
          test/app_theme_test.dart
          test/shared_ui_performance_regression_test.dart
      - name: Test
        run: flutter test --concurrency=1
      - name: Verify release signing guard
        shell: bash
        run: |
          dart run tool/configure_firebase_smoke.dart --environment=staging
          set +e
          output=$(cd android && ./gradlew :app:assembleStagingRelease 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep -q "Release signing is not configured"

  android-staging-build:
    needs: full-suite-consent
    runs-on: [self-hosted, macOS, petmagic-mobile]
    defaults:
      run:
        working-directory: apps/petmagic-mobile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.5'
          cache: false
      - name: Configure persistent local dependency caches
        shell: bash
        run: |
          cache_root="$HOME/.cache/petmagic-ci"
          mkdir -p "$cache_root/pub" "$cache_root/gradle"
          {
            echo "PUB_CACHE=$cache_root/pub"
            echo "GRADLE_USER_HOME=$cache_root/gradle"
          } >> "$GITHUB_ENV"
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Android staging release smoke
        env:
          ORG_GRADLE_PROJECT_allowInsecureReleaseSigning: "true"
          ORG_GRADLE_PROJECT_allowPlaceholderFirebase: "true"
        run: |
          dart run tool/configure_firebase_smoke.dart --environment=staging
          flutter build appbundle --release --flavor staging \
            --android-project-arg=allowInsecureReleaseSigning=true \
            --android-project-arg=allowPlaceholderFirebase=true \
            --dart-define=APP_ENVIRONMENT=staging \
            --dart-define=APP_PACKAGE_NAME=com.petmagic.app.staging \
            --dart-define=API_BASE_URL=https://api.staging.petgpt.app \
            --build-number="$GITHUB_RUN_NUMBER" \
            --obfuscate --split-debug-info=build/symbols/staging
      - name: Enforce Android release size budget
        run: >-
          dart run tool/check_release_size_budget.dart
          --artifact build/app/outputs/bundle/stagingRelease/app-staging-release.aab
          --baseline-bytes 95104021
          --max-growth-percent 5

  android-production-build:
    needs: full-suite-consent
    runs-on: [self-hosted, macOS, petmagic-mobile]
    defaults:
      run:
        working-directory: apps/petmagic-mobile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.5'
          cache: false
      - name: Configure persistent local dependency caches
        shell: bash
        run: |
          cache_root="$HOME/.cache/petmagic-ci"
          mkdir -p "$cache_root/pub" "$cache_root/gradle"
          {
            echo "PUB_CACHE=$cache_root/pub"
            echo "GRADLE_USER_HOME=$cache_root/gradle"
          } >> "$GITHUB_ENV"
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Android production release smoke
        env:
          ORG_GRADLE_PROJECT_allowInsecureReleaseSigning: "true"
          ORG_GRADLE_PROJECT_allowPlaceholderFirebase: "true"
        run: |
          dart run tool/configure_firebase_smoke.dart --environment=production
          flutter build appbundle --release --flavor production \
            --android-project-arg=allowInsecureReleaseSigning=true \
            --android-project-arg=allowPlaceholderFirebase=true \
            --dart-define=APP_ENVIRONMENT=production \
            --dart-define=APP_PACKAGE_NAME=com.petmagic.app \
            --dart-define=API_BASE_URL=https://api.petgpt.app \
            --build-number="$GITHUB_RUN_NUMBER" \
            --obfuscate --split-debug-info=build/symbols/production

  android-device-ui-smoke:
    if: inputs.run_device_suite
    needs: full-suite-consent
    runs-on: [self-hosted, macOS, petmagic-mobile]
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - core_user_journey_test
          - templates_feed_stress_test
          - gallery_cross_flow_test
          - watermark_result_flow_test
    defaults:
      run:
        working-directory: apps/petmagic-mobile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.5'
          cache: false
      - name: Configure persistent local dependency caches
        shell: bash
        run: |
          cache_root="$HOME/.cache/petmagic-ci"
          mkdir -p "$cache_root/pub" "$cache_root/gradle"
          {
            echo "PUB_CACHE=$cache_root/pub"
            echo "GRADLE_USER_HOME=$cache_root/gradle"
          } >> "$GITHUB_ENV"
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate staging Firebase smoke configuration
        run: dart run tool/configure_firebase_smoke.dart --environment=staging
      - name: Resolve Android emulator ABI for this Mac
        id: android_emulator_abi
        shell: bash
        run: |
          if [[ "$(uname -m)" == 'arm64' ]]; then
            echo 'value=arm64-v8a' >> "$GITHUB_OUTPUT"
          else
            echo 'value=x86_64' >> "$GITHUB_OUTPUT"
          fi
      - name: Prebuild Android integration scenario
        run: >-
          flutter build apk --debug --flavor staging
          --target integration_test/${{ matrix.scenario }}.dart
          --dart-define=APP_ENVIRONMENT=staging
          --dart-define=APP_PACKAGE_NAME=com.petmagic.app.staging
          --dart-define=API_BASE_URL=https://api.staging.petgpt.app
      - name: Run deterministic mobile scenario on Android
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: ${{ steps.android_emulator_abi.outputs.value }}
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: |
            cd apps/petmagic-mobile && flutter test integration_test/${{ matrix.scenario }}.dart -d emulator-5554 --flavor staging --dart-define=APP_ENVIRONMENT=staging --dart-define=APP_PACKAGE_NAME=com.petmagic.app.staging --dart-define=API_BASE_URL=https://api.staging.petgpt.app

  ios-build:
    needs: full-suite-consent
    runs-on: [self-hosted, macOS, petmagic-mobile]
    defaults:
      run:
        working-directory: apps/petmagic-mobile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.5'
          cache: false
      - name: Configure persistent local dependency cache
        shell: bash
        run: |
          cache_root="$HOME/.cache/petmagic-ci"
          mkdir -p "$cache_root/pub"
          echo "PUB_CACHE=$cache_root/pub" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Build iOS staging release smoke
        env:
          PETMAGIC_ALLOW_PLACEHOLDER_FIREBASE: "true"
        run: |
          dart run tool/configure_firebase_smoke.dart --environment=staging
          flutter build ios --no-codesign --release --flavor staging \
            --dart-define=APP_ENVIRONMENT=staging \
            --dart-define=APP_PACKAGE_NAME=com.petmagic.app.staging \
            --dart-define=API_BASE_URL=https://api.staging.petgpt.app \
            --build-number="$GITHUB_RUN_NUMBER" \
            --obfuscate --split-debug-info=build/symbols/ios-staging
      - name: Build iOS production release smoke
        env:
          PETMAGIC_ALLOW_PLACEHOLDER_FIREBASE: "true"
        run: |
          dart run tool/configure_firebase_smoke.dart --environment=production
          flutter build ios --no-codesign --release --flavor production \
            --dart-define=APP_ENVIRONMENT=production \
            --dart-define=APP_PACKAGE_NAME=com.petmagic.app \
            --dart-define=API_BASE_URL=https://api.petgpt.app \
            --build-number="$GITHUB_RUN_NUMBER" \
            --obfuscate --split-debug-info=build/symbols/ios-production

  ios-device-ui-smoke:
    if: inputs.run_device_suite
    needs: full-suite-consent
    runs-on: [self-hosted, macOS, petmagic-mobile]
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - core_user_journey_test
          - templates_feed_stress_test
          - gallery_cross_flow_test
          - watermark_result_flow_test
    defaults:
      run:
        working-directory: apps/petmagic-mobile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.5'
          cache: false
      - name: Configure persistent local dependency cache
        shell: bash
        run: |
          cache_root="$HOME/.cache/petmagic-ci"
          mkdir -p "$cache_root/pub"
          echo "PUB_CACHE=$cache_root/pub" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Run deterministic iOS core flows
        env:
          PETMAGIC_ALLOW_PLACEHOLDER_FIREBASE: "true"
        run: |
          dart run tool/configure_firebase_smoke.dart --environment=staging
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((d["udid"] for runtime in data["devices"].values() for d in runtime if d.get("isAvailable") and "iPhone" in d["name"]), ""))')
          test -n "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          flutter test integration_test/${{ matrix.scenario }}.dart \
            -d "$DEVICE_ID" \
            --flavor staging \
            --dart-define=APP_ENVIRONMENT=staging \
            --dart-define=APP_PACKAGE_NAME=com.petmagic.app.staging \
            --dart-define=API_BASE_URL=https://api.staging.petgpt.app
