name: mobile-ci

on:
  pull_request:
    paths:
      - apps/petmagic-mobile/**
      - .github/workflows/mobile-ci.yml
  push:
    branches:
      - main
    paths:
      - apps/petmagic-mobile/**
      - .github/workflows/mobile-ci.yml

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/petmagic-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Verify generation localization completeness
        run: dart run tool/check_generation_status_l10n.dart

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Verify release signing guard
        shell: bash
        run: |
          set +e
          output=$(cd android && ./gradlew :app:assembleRelease 2>&1)
          status=$?
          set -e

          echo "$output"

          if [ "$status" -eq 0 ]; then
            echo "Expected release signing guard to fail without key.properties"
            exit 1
          fi

          if ! echo "$output" | grep -q "Release signing is not configured"; then
            echo "Release task failed for an unexpected reason"
            exit 1
          fi

      - name: Test
        run: flutter test
