name: admin-web-ci

on:
  pull_request:
    paths:
      - apps/admin-web/**
      - .github/workflows/admin-web-ci.yml
  push:
    branches:
      - main
    paths:
      - apps/admin-web/**
      - .github/workflows/admin-web-ci.yml

jobs:
  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
