name: mobile-release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected environment to release
        required: true
        type: choice
        options: [staging, production]
      platform:
        description: Platform to build and upload
        required: true
        default: android
        type: choice
        options: [android, ios, all]
      signing_mode:
        description: iOS Match mode; bootstrap is only for the first signing run
        required: true
        default: readonly
        type: choice
        options: [readonly, bootstrap]
      publish:
        description: Upload the completed artifact to Play Internal or TestFlight
        required: true
        default: false
        type: boolean
      retain_artifacts:
        description: Keep a seven-day GitHub artifact copy of the build and symbols
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: [self-hosted, macOS, petmagic-mobile]
    environment: ${{ inputs.environment || 'production' }}
    defaults:
      run:
        working-directory: apps/petmagic-mobile
    env:
      RELEASE_ENVIRONMENT: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: '3.44.5', cache: false }
      - name: Configure persistent local dependency caches
        shell: bash
        run: |
          cache_root="$HOME/.cache/petmagic-ci"
          mkdir -p "$cache_root/pub" "$cache_root/gradle" "$cache_root/bundle"
          {
            echo "PUB_CACHE=$cache_root/pub"
            echo "GRADLE_USER_HOME=$cache_root/gradle"
            echo "BUNDLE_PATH=$cache_root/bundle"
          } >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/petmagic-ruby-toolcache
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/petmagic-ruby-toolcache
        with: { ruby-version: '3.3', bundler-cache: false, working-directory: apps/petmagic-mobile }
      - run: flutter pub get
      - name: Install Ruby release tooling
        run: bundle install --jobs 4 --retry 3
      - name: Resolve release identity
        shell: bash
        run: |
          if [ "$RELEASE_ENVIRONMENT" = "staging" ]; then
            echo 'APP_PACKAGE_NAME=com.petmagic.app.staging' >> "$GITHUB_ENV"
            echo 'API_BASE_URL=https://api.staging.petgpt.app' >> "$GITHUB_ENV"
          else
            echo 'APP_PACKAGE_NAME=com.petmagic.app' >> "$GITHUB_ENV"
            echo 'API_BASE_URL=https://api.petgpt.app' >> "$GITHUB_ENV"
          fi
      - name: Verify canonical tag
        if: startsWith(github.ref, 'refs/tags/')
        run: dart tool/verify_release_version.dart --tag=${{ github.ref_name }}
      - name: Inject protected Android credentials
        shell: bash
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set +x
          printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          {
            echo 'storeFile=release.keystore'
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > build-google-play-key.json
      - name: Build signed AAB
        shell: bash
        run: |
          heartbeat() {
            while sleep 60; do
              echo "Android release build is still running at $(date -u +%FT%TZ)."
              if command -v memory_pressure >/dev/null 2>&1; then
                memory_pressure | head -n 5
              elif command -v free >/dev/null 2>&1; then
                free -h
              fi
            done
          }
          heartbeat &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT

          flutter build appbundle --no-pub --release --flavor "$RELEASE_ENVIRONMENT" \
            --dart-define=APP_ENVIRONMENT="$RELEASE_ENVIRONMENT" \
            --dart-define=APP_PACKAGE_NAME="$APP_PACKAGE_NAME" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --obfuscate --split-debug-info="build/symbols/$RELEASE_ENVIRONMENT"
      - id: crashlytics_symbols
        name: Determine Crashlytics symbol upload availability
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo 'upload=true' >> "$GITHUB_OUTPUT"
          else
            echo 'upload=false' >> "$GITHUB_OUTPUT"
            echo 'Crashlytics symbol upload skipped: FIREBASE_TOKEN is not configured.'
          fi
      - name: Upload Dart symbols to Crashlytics
        if: steps.crashlytics_symbols.outputs.upload == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase_app_id="$(jq -r --arg package_name "$APP_PACKAGE_NAME" '.client[] | select(.client_info.android_client_info.package_name == $package_name) | .client_info.mobilesdk_app_id' android/app/google-services.json)"
          test -n "$firebase_app_id" && test "$firebase_app_id" != "null"
          npx --yes firebase-tools@15.22.4 crashlytics:symbols:upload --app="$firebase_app_id" "build/symbols/$RELEASE_ENVIRONMENT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.retain_artifacts
        with:
          name: android-${{ inputs.environment || 'production' }}-release-${{ github.run_id }}
          path: |
            apps/petmagic-mobile/build/app/outputs/bundle/${{ inputs.environment || 'production' }}Release/app-${{ inputs.environment || 'production' }}-release.aab
            apps/petmagic-mobile/build/symbols/${{ inputs.environment || 'production' }}
          retention-days: 7
          if-no-files-found: error
      - name: Upload exact artifact to Play Internal
        if: inputs.publish
        env:
          AAB_PATH: ${{ github.workspace }}/apps/petmagic-mobile/build/app/outputs/bundle/${{ inputs.environment || 'production' }}Release/app-${{ inputs.environment || 'production' }}-release.aab
          GOOGLE_PLAY_JSON_KEY_PATH: ${{ github.workspace }}/apps/petmagic-mobile/build-google-play-key.json
        run: GOOGLE_PLAY_PACKAGE_NAME="$APP_PACKAGE_NAME" bundle exec fastlane android upload_internal
      - name: Store publication skipped
        if: ${{ !inputs.publish }}
        run: echo 'Build completed without Play Internal upload because publish=false.'
      - name: Remove temporary Android credentials
        if: always()
        shell: bash
        run: |
          rm -f \
            android/app/google-services.json \
            android/app/release.keystore \
            android/key.properties \
            build-google-play-key.json

  ios:
    if: inputs.platform != 'android'
    runs-on: [self-hosted, macOS, petmagic-mobile]
    environment: ${{ inputs.environment || 'production' }}
    defaults:
      run:
        working-directory: apps/petmagic-mobile
    env:
      RELEASE_ENVIRONMENT: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: '3.44.5', cache: false }
      - name: Configure persistent local dependency caches
        shell: bash
        run: |
          cache_root="$HOME/.cache/petmagic-ci"
          mkdir -p "$cache_root/pub" "$cache_root/gradle" "$cache_root/bundle"
          {
            echo "PUB_CACHE=$cache_root/pub"
            echo "GRADLE_USER_HOME=$cache_root/gradle"
            echo "BUNDLE_PATH=$cache_root/bundle"
          } >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/petmagic-ruby-toolcache
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/petmagic-ruby-toolcache
        with: { ruby-version: '3.3', bundler-cache: false, working-directory: apps/petmagic-mobile }
      - run: flutter pub get
      - name: Install Ruby release tooling
        run: bundle install --jobs 4 --retry 3
      - name: Resolve release identity
        shell: bash
        run: |
          if [ "$RELEASE_ENVIRONMENT" = "staging" ]; then
            echo 'APP_PACKAGE_NAME=com.petmagic.app.staging' >> "$GITHUB_ENV"
            echo 'API_BASE_URL=https://api.staging.petgpt.app' >> "$GITHUB_ENV"
          else
            echo 'APP_PACKAGE_NAME=com.petmagic.app' >> "$GITHUB_ENV"
            echo 'API_BASE_URL=https://api.petgpt.app' >> "$GITHUB_ENV"
          fi
      - name: Verify canonical tag
        if: startsWith(github.ref, 'refs/tags/')
        run: dart tool/verify_release_version.dart --tag=${{ github.ref_name }}
      - name: Inject protected iOS Firebase config
        shell: bash
        env:
          FIREBASE_IOS_CONFIG_BASE64: ${{ secrets.FIREBASE_IOS_CONFIG_BASE64 }}
        run: |
          set +x
          printf '%s' "$FIREBASE_IOS_CONFIG_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          echo "PETMAGIC_GOOGLE_CLIENT_ID=$(/usr/libexec/PlistBuddy -c 'Print :CLIENT_ID' ios/Runner/GoogleService-Info.plist)" >> "$GITHUB_ENV"
          echo "PETMAGIC_GOOGLE_REVERSED_CLIENT_ID=$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' ios/Runner/GoogleService-Info.plist)" >> "$GITHUB_ENV"
      - name: Load dedicated Match repository deploy key
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
      - name: Sync signing
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_READONLY: ${{ inputs.signing_mode != 'bootstrap' }}
        run: APP_STORE_BUNDLE_ID="$APP_PACKAGE_NAME" bundle exec fastlane ios sync_signing
      - name: Build signed IPA once
        run: |
          flutter build ipa --release --flavor "$RELEASE_ENVIRONMENT" --export-method app-store \
            --dart-define=APP_ENVIRONMENT="$RELEASE_ENVIRONMENT" \
            --dart-define=APP_PACKAGE_NAME="$APP_PACKAGE_NAME" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --obfuscate --split-debug-info="build/symbols/ios-$RELEASE_ENVIRONMENT"
      - id: ios_crashlytics_symbols
        name: Determine iOS Crashlytics symbol upload availability
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo 'upload=true' >> "$GITHUB_OUTPUT"
          else
            echo 'upload=false' >> "$GITHUB_OUTPUT"
            echo 'Crashlytics symbol upload skipped: FIREBASE_TOKEN is not configured.'
          fi
      - name: Upload iOS symbols to Crashlytics
        if: steps.ios_crashlytics_symbols.outputs.upload == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx --yes firebase-tools@15.22.4 crashlytics:symbols:upload --app=${{ secrets.FIREBASE_IOS_APP_ID }} "build/symbols/ios-$RELEASE_ENVIRONMENT"
          ios/Pods/FirebaseCrashlytics/upload-symbols -gsp ios/Runner/GoogleService-Info.plist -p ios build/ios/archive/Runner.xcarchive/dSYMs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.retain_artifacts
        with:
          name: ios-${{ inputs.environment || 'production' }}-symbols-${{ github.run_id }}
          path: |
            apps/petmagic-mobile/build/symbols/ios-${{ inputs.environment || 'production' }}
            apps/petmagic-mobile/build/ios/archive/Runner.xcarchive/dSYMs
          retention-days: 7
          if-no-files-found: error
      - name: Upload exact artifact to TestFlight
        if: inputs.publish
        env:
          IPA_PATH: ${{ github.workspace }}/apps/petmagic-mobile/build/ios/ipa/petmagic_mobile.ipa
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: APP_STORE_BUNDLE_ID="$APP_PACKAGE_NAME" bundle exec fastlane ios upload_testflight
      - name: Store publication skipped
        if: ${{ !inputs.publish }}
        run: echo 'Build completed without TestFlight upload because publish=false.'
      - name: Remove temporary iOS Firebase configuration
        if: always()
        shell: bash
        run: rm -f ios/Runner/GoogleService-Info.plist
