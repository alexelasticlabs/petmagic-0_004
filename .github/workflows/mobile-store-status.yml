name: mobile-store-status

on:
  workflow_dispatch:
    inputs:
      ios_version:
        description: Marketing version to check in TestFlight
        required: true
        default: "1.0.0"
        type: string
      repair_subscription_group_localization:
        description: Create missing customer-facing subscription group localizations for supported US and EU app locales
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mobile-store-status
  cancel-in-progress: false

jobs:
  ios-testflight-status:
    runs-on: [self-hosted, macOS, petmagic-mobile]
    environment: production
    defaults:
      run:
        working-directory: apps/petmagic-mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Configure persistent local dependency cache
        shell: bash
        run: |
          cache_root="$HOME/.cache/petmagic-ci"
          mkdir -p "$cache_root/bundle"
          echo "BUNDLE_PATH=$cache_root/bundle" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
          working-directory: apps/petmagic-mobile
      - name: Install Ruby release tooling
        run: bundle install --jobs 4 --retry 3
      - name: Read TestFlight processing status
        env:
          APP_STORE_BUNDLE_ID: com.petmagic.app
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_VERSION: ${{ inputs.ios_version }}
        run: bundle exec fastlane ios testflight_status
      - name: Read App Store purchase catalog
        env:
          APP_STORE_CONNECT_APP_ID: "6796478761"
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APP_STORE_CATALOG_REPAIR: ${{ inputs.repair_subscription_group_localization }}
        run: bundle exec fastlane ios catalog_status
