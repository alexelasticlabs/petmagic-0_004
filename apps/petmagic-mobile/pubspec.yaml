name: petmagic_mobile
description: "PetMagic mobile app for iOS and Android."
publish_to: "none"

version: 1.0.0+41

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # Flutter material/adaptive widgets can reference Cupertino icon glyphs in
  # release builds even when app code does not import CupertinoIcons directly.
  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0
  dio: ^5.9.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  video_player: ^2.11.1
  visibility_detector: ^0.4.0+2
  shared_preferences: ^2.5.5
  crypto: ^3.0.7
  flutter_secure_storage: ^10.3.1
  intl: ^0.20.2
  image_picker: ^1.2.3
  image: ^4.9.1
  http_parser: ^4.1.2
  app_links:
    path: third_party/flutter_plugins/app_links
  google_sign_in: 7.2.0
  sign_in_with_apple:
    path: third_party/flutter_plugins/sign_in_with_apple
  url_launcher: ^6.3.2
  share_plus: ^13.2.0
  photo_manager:
    path: third_party/flutter_plugins/photo_manager
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.1
  flutter_stripe: ^14.0.0
  firebase_core: ^4.10.0
  firebase_crashlytics: ^5.1.0
  firebase_messaging: ^16.3.0
  flutter_localizations:
    sdk: flutter
  signalr_netcore: ^1.4.4
  permission_handler: ^12.0.3
  connectivity_plus: ^7.2.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  image_picker_platform_interface: ^2.11.1
  shared_preferences_platform_interface: ^2.4.2
  video_player_platform_interface: ^6.7.0
  flutter_launcher_icons: ^0.14.3

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/auth/
    - assets/branding/premium-hero-dark.png
    - assets/branding/premium-hero-light.png
    - assets/rewards/

  fonts:
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#4B21D1"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F7F8FC"
  color_dark: "#090A12"
  image: "assets/icons/app_icon.png"
  android: true
  ios: true
  web: false
  fullscreen: false
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#F7F8FC"
    color_dark: "#090A12"
    image: "assets/icons/app_icon.png"
    icon_background_color: "#F7F8FC"
    icon_background_color_dark: "#090A12"
