org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Gradle/Kotlin DSL in this project is not compatible with Java 25 yet.
android.useAndroidX=true
kotlin.incremental=false
# AGP 9 + Flutter 3.44.4 still crashes inside the Flutter Gradle plugin when
# the new Android DSL is enabled (`dev.flutter.flutter-gradle-plugin` throws a
# NullPointerException while applying the app module), so keep only this
# compatibility opt-out until the Flutter toolchain catches up.
android.newDsl=false
# Built-in Kotlin is still blocked by the current Flutter plugin ecosystem:
# Flutter auto-applies KGP for Android plugins without explicit detection,
# which fails under AGP 9 for several direct and transitive packages.
android.builtInKotlin=false
