org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
org.gradle.parallel=true
# Gradle/Kotlin DSL in this project is not compatible with Java 25 yet.
android.useAndroidX=true
kotlin.incremental=false
# Compatibility hold validated on 2026-07-03: removing these AGP 9 opt-outs
# makes dev.flutter.flutter-gradle-plugin fail with a NullPointerException
# before the app module configures. Remove only after the Flutter toolchain and
# Android plugin dependencies build cleanly with AGP built-in Kotlin/new DSL.
android.newDsl=false
android.builtInKotlin=false
