name: petmagic-0_004

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: petmagic_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: petmagic_db
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U petmagic_user -d petmagic_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - petmagic-network

  mailpit:
    image: axllent/mailpit:v1.19
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${MAILPIT_WEB_HOST_PORT:-8025}:8025"
    networks:
      - petmagic-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    mem_limit: "${BACKEND_MEMORY_LIMIT:-768m}"
    cpus: "${BACKEND_CPUS:-1.0}"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_HTTP_PORTS: 5000
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=petmagic_db;Username=petmagic_user;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env. Generate with openssl rand -base64 64}"
      Jwt__Issuer: petmagic.app
      Jwt__Audience: petmagic-admin
      DataProtection__CertificatePassword: "${DATA_PROTECTION_CERTIFICATE_PASSWORD:-}"
      BootstrapAdmin__Email: "${BOOTSTRAP_ADMIN_EMAIL:-admin@petmagic.app}"
      BootstrapAdmin__Password: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      BootstrapAdmin__DisplayName: "${BOOTSTRAP_ADMIN_DISPLAY_NAME:-PetMagic Admin}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_AUDIENCES: "${GOOGLE_AUDIENCES:-}"
      APPLE_CLIENT_ID: "${APPLE_CLIENT_ID:-}"
      APPLE_CLIENT_SECRET: "${APPLE_CLIENT_SECRET:-}"
      APPLE_AUDIENCES: "${APPLE_AUDIENCES:-}"
      APPLE_AUTHORIZATION_ENDPOINT: "${APPLE_AUTHORIZATION_ENDPOINT:-}"
      APPLE_TOKEN_ENDPOINT: "${APPLE_TOKEN_ENDPOINT:-}"
      EMAIL_HOST: "${EMAIL_HOST:-mailpit}"
      EMAIL_PORT: "${EMAIL_PORT:-1025}"
      EMAIL_USERNAME: "${EMAIL_USERNAME:-}"
      EMAIL_PASSWORD: "${EMAIL_PASSWORD:-}"
      EMAIL_USE_SSL: "${EMAIL_USE_SSL:-false}"
      EMAIL_FROM_ADDRESS: "${EMAIL_FROM_ADDRESS:-no-reply@petmagic.app}"
      EMAIL_FROM_NAME: "${EMAIL_FROM_NAME:-PetMagic}"
      STRIPE_TEST_SECRET_KEY: "${STRIPE_TEST_SECRET_KEY:-}"
      STRIPE_TEST_PUBLISHABLE_KEY: "${STRIPE_TEST_PUBLISHABLE_KEY:-}"
      STRIPE_TEST_WEBHOOK_SECRET: "${STRIPE_TEST_WEBHOOK_SECRET:-}"
      STRIPE_LIVE_SECRET_KEY: "${STRIPE_LIVE_SECRET_KEY:-}"
      STRIPE_LIVE_PUBLISHABLE_KEY: "${STRIPE_LIVE_PUBLISHABLE_KEY:-}"
      STRIPE_LIVE_WEBHOOK_SECRET: "${STRIPE_LIVE_WEBHOOK_SECRET:-}"
      STRIPE_CHECKOUT_SUCCESS_URL: "${STRIPE_CHECKOUT_SUCCESS_URL:-petmagic://checkout/success?session_id={CHECKOUT_SESSION_ID}}"
      STRIPE_CHECKOUT_CANCEL_URL: "${STRIPE_CHECKOUT_CANCEL_URL:-petmagic://checkout/cancel}"
      STRIPE_BILLING_PORTAL_RETURN_URL: "${STRIPE_BILLING_PORTAL_RETURN_URL:-}"
      GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL: "${GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL:-}"
      GOOGLE_PLAY_PRIVATE_KEY_PEM: "${GOOGLE_PLAY_PRIVATE_KEY_PEM:-}"
      GOOGLE_PLAY_ENVIRONMENT: "${GOOGLE_PLAY_ENVIRONMENT:-production}"
      GOOGLE_PLAY_PUBSUB_AUDIENCE: "${GOOGLE_PLAY_PUBSUB_AUDIENCE:-}"
      GOOGLE_PLAY_PUBSUB_EXPECTED_EMAIL: "${GOOGLE_PLAY_PUBSUB_EXPECTED_EMAIL:-}"
      APP_STORE_SHARED_SECRET: "${APP_STORE_SHARED_SECRET:-}"
      APP_STORE_ENVIRONMENT: "${APP_STORE_ENVIRONMENT:-production}"
      STORE_ACCOUNT_BINDING_MODE: "${STORE_ACCOUNT_BINDING_MODE:-compatibility}"
      ForwardedHeaders__Enabled: "${FORWARDED_HEADERS_ENABLED:-false}"
      ForwardedHeaders__TrustAll: "${FORWARDED_HEADERS_TRUST_ALL:-false}"
      FAL_AI_API_KEY: "${FAL_AI_API_KEY:-}"
      FAL_WEBHOOK_URL: "${FAL_WEBHOOK_URL:-}"
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
      R2_ACCESS_KEY: "${R2_ACCESS_KEY:-}"
      R2_SECRET_KEY: "${R2_SECRET_KEY:-}"
      R2_BUCKET_NAME: "${R2_BUCKET_NAME:-}"
      R2_PUBLIC_URL: "${R2_PUBLIC_URL:-}"
      Identity__AvatarStorage__PublicBaseUrl: "${BACKEND_PUBLIC_BASE_URL:?BACKEND_PUBLIC_BASE_URL is required for public backend media URLs}"
      SupportChat__AttachmentStorage__PublicBaseUrl: "${BACKEND_PUBLIC_BASE_URL:?BACKEND_PUBLIC_BASE_URL is required for public support attachment URLs}"
      Templates__PublicBaseUrl: "${BACKEND_PUBLIC_BASE_URL:?BACKEND_PUBLIC_BASE_URL is required for public template media URLs}"
      Templates__StorageProvider: "${TEMPLATES_STORAGE_PROVIDER:?Set TEMPLATES_STORAGE_PROVIDER to R2 or Local explicitly}"
      Templates__AiProvider: "${TEMPLATES_AI_PROVIDER:?Set TEMPLATES_AI_PROVIDER to Fal or Fake explicitly}"
      Templates__Watermark__Enabled: "${TEMPLATES_WATERMARK_ENABLED:-false}"
      Templates__TemplateOfTheDayAutoPickWorkerEnabled: "${TEMPLATES_TEMPLATE_OF_THE_DAY_AUTO_PICK_WORKER_ENABLED:-false}"
      PETMAGIC_LOCAL_SMOKE_FAST_FAKE_COMPLETION: "${PETMAGIC_LOCAL_SMOKE_FAST_FAKE_COMPLETION:?Set PETMAGIC_LOCAL_SMOKE_FAST_FAKE_COMPLETION to false for production or true only for local smoke}"
      Templates__GenerationWorkerEnabled: "false"
      Templates__GlobalMaxConcurrentGenerations: "${GENERATION_GLOBAL_MAX_CONCURRENT:-3}"
      Templates__ImageReservedConcurrentGenerations: "${GENERATION_IMAGE_RESERVED_CONCURRENT:-0}"
      Templates__ImageMaxConcurrentGenerations: "${GENERATION_IMAGE_MAX_CONCURRENT:-2}"
      Templates__ImageProtectedConcurrentGenerations: "${GENERATION_IMAGE_PROTECTED_CONCURRENT:-0}"
      Templates__VideoReservedConcurrentGenerations: "${GENERATION_VIDEO_RESERVED_CONCURRENT:-0}"
      Templates__VideoMaxConcurrentGenerations: "${GENERATION_VIDEO_MAX_CONCURRENT:-1}"
      Templates__VideoBorrowMaxConcurrentGenerations: "${GENERATION_VIDEO_BORROW_MAX_CONCURRENT:-0}"
      Templates__EnableElasticLaneBorrowing: "${GENERATION_ENABLE_ELASTIC_LANE_BORROWING:-false}"
      Templates__AllowVideoBorrowWhenImageQueueEmpty: "${GENERATION_ALLOW_VIDEO_BORROW_WHEN_IMAGE_QUEUE_EMPTY:-true}"
      Templates__AllowVideoBorrowWhenImageEstimatedWaitBelowSeconds: "${GENERATION_ALLOW_VIDEO_BORROW_IMAGE_WAIT_BELOW_SECONDS:-120}"
      Templates__VideoBorrowReleaseMode: "${GENERATION_VIDEO_BORROW_RELEASE_MODE:-natural_completion}"
      Templates__BorrowedVideoMaxAgeSeconds: "${GENERATION_BORROWED_VIDEO_MAX_AGE_SECONDS:-0}"
      Templates__BorrowingPriorityTiers: "${GENERATION_BORROWING_PRIORITY_TIERS:-premium,privileged,admin,free}"
      Templates__VideoPreprocessingMaxConcurrentGenerations: "${GENERATION_VIDEO_PREPROCESSING_MAX_CONCURRENT:-1}"
      Templates__FalProviderConcurrencyLimit: "${FAL_PROVIDER_CONCURRENCY_LIMIT:-0}"
      Templates__FalProviderReservedConcurrency: "${FAL_PROVIDER_RESERVED_CONCURRENCY:-1}"
      Templates__FalProviderBalanceLowThresholdUsd: "${FAL_PROVIDER_BALANCE_LOW_THRESHOLD_USD:-100}"
      Templates__FalProviderBalanceCriticalThresholdUsd: "${FAL_PROVIDER_BALANCE_CRITICAL_THRESHOLD_USD:-25}"
      Templates__FalProviderSpendDailyLimitUsd: "${FAL_PROVIDER_SPEND_DAILY_LIMIT_USD:-0}"
      Templates__QueueMaxSize: "${GENERATION_QUEUE_MAX_SIZE:-1000}"
      Templates__EstimatedVideoGenerationSeconds: "${GENERATION_ESTIMATED_VIDEO_SECONDS:-420}"
      Templates__EstimatedImageGenerationSeconds: "${GENERATION_ESTIMATED_IMAGE_SECONDS:-90}"
      Templates__EstimatedVideoPreprocessingSeconds: "${GENERATION_ESTIMATED_VIDEO_PREPROCESSING_SECONDS:-90}"
      Templates__FreeImageMaxEstimatedWaitSeconds: "${GENERATION_FREE_IMAGE_MAX_WAIT_SECONDS:-1800}"
      Templates__PremiumImageMaxEstimatedWaitSeconds: "${GENERATION_PREMIUM_IMAGE_MAX_WAIT_SECONDS:-900}"
      Templates__PrivilegedImageMaxEstimatedWaitSeconds: "${GENERATION_PRIVILEGED_IMAGE_MAX_WAIT_SECONDS:-900}"
      Templates__FreeVideoMaxEstimatedWaitSeconds: "${GENERATION_FREE_VIDEO_MAX_WAIT_SECONDS:-3600}"
      Templates__PremiumVideoMaxEstimatedWaitSeconds: "${GENERATION_PREMIUM_VIDEO_MAX_WAIT_SECONDS:-1800}"
      Templates__PrivilegedVideoMaxEstimatedWaitSeconds: "${GENERATION_PRIVILEGED_VIDEO_MAX_WAIT_SECONDS:-1800}"
      Templates__QueuePriorityAgingIntervalSeconds: "${GENERATION_PRIORITY_AGING_INTERVAL_SECONDS:-60}"
      Templates__QueuePriorityAgingBoost: "${GENERATION_PRIORITY_AGING_BOOST:-500}"
      Templates__CancelQueuedGenerationEnabled: "${GENERATION_CANCEL_QUEUED_ENABLED:-true}"
      Templates__RealtimeEventRetentionMinutes: "${TEMPLATES_REALTIME_EVENT_RETENTION_MINUTES:-60}"
      Templates__RealtimeEventCleanupIntervalMinutes: "${TEMPLATES_REALTIME_EVENT_CLEANUP_INTERVAL_MINUTES:-10}"
      Templates__RealtimeEventCleanupBatchSize: "${TEMPLATES_REALTIME_EVENT_CLEANUP_BATCH_SIZE:-1000}"
      Templates__MaxConcurrentJobsPerWorker: "${GENERATION_WORKER_MAX_CONCURRENT_JOBS:-1}"
      Templates__GenerationWorkerPollIntervalMilliseconds: "${GENERATION_WORKER_POLL_INTERVAL_MS:-500}"
      Templates__MaxAiProviderRequestsPerMinute: "${GENERATION_PROVIDER_MAX_RPM:-60}"
      Templates__MaxGenerationAttempts: "${GENERATION_MAX_ATTEMPTS:-3}"
      Templates__RefundRetryDelayMilliseconds: "${GENERATION_REFUND_RETRY_DELAY_MS:-30000}"
      Templates__JobLockTimeoutMilliseconds: "${GENERATION_JOB_LOCK_TIMEOUT_MS:-900000}"
      Templates__OrphanQueuedJobTimeoutMilliseconds: "${GENERATION_ORPHAN_QUEUED_TIMEOUT_MS:-120000}"
      RateLimiting__Auth__PermitLimit: "${RATE_LIMIT_AUTH_PERMIT:-30}"
      RateLimiting__Economy__PermitLimit: "${RATE_LIMIT_ECONOMY_PERMIT:-60}"
      RateLimiting__Templates__PermitLimit: "${RATE_LIMIT_TEMPLATES_PERMIT:-90}"
      RateLimiting__GenerationCreate__PermitLimit: "${RATE_LIMIT_GENERATION_CREATE_PERMIT:-12}"
      RateLimiting__GenerationStatus__PermitLimit: "${RATE_LIMIT_GENERATION_STATUS_PERMIT:-180}"
      RateLimiting__SupportChat__PermitLimit: "${RATE_LIMIT_SUPPORT_CHAT_PERMIT:-60}"
      RateLimiting__Admin__PermitLimit: "${RATE_LIMIT_ADMIN_PERMIT:-120}"
      RateLimiting__Webhooks__PermitLimit: "${RATE_LIMIT_WEBHOOKS_PERMIT:-120}"
      RateLimiting__AuthRegister__PermitLimit: "${RATE_LIMIT_AUTH_REGISTER_PERMIT:-8}"
      RateLimiting__AuthPasswordReset__PermitLimit: "${RATE_LIMIT_AUTH_PASSWORD_RESET_PERMIT:-10}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      AllowedHosts: "${BACKEND_ALLOWED_HOSTS:?Set BACKEND_ALLOWED_HOSTS to the public backend host names}"
    ports:
      - "${BACKEND_HOST_PORT:-5001}:5000"
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent --header 'Host: ${BACKEND_HEALTHCHECK_HOST:?Set BACKEND_HEALTHCHECK_HOST to a host allowed by BACKEND_ALLOWED_HOSTS}' http://localhost:5000/health >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - backend_data_protection:/home/appuser/.aspnet/DataProtection-Keys
      - backend_support_attachments:/app/wwwroot/support-attachments
      - backend_user_avatars:/app/wwwroot/user-avatars
      - backend_template_media:/app/wwwroot/templates-media
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - petmagic-network

  generation-worker:
    build:
      context: .
      dockerfile: Dockerfile.generation-worker
    restart: unless-stopped
    mem_limit: "${GENERATION_WORKER_MEMORY_LIMIT:-768m}"
    cpus: "${GENERATION_WORKER_CPUS:-1.0}"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      DOTNET_ENVIRONMENT: "${DOTNET_ENVIRONMENT:-${ASPNETCORE_ENVIRONMENT:-Production}}"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=petmagic_db;Username=petmagic_user;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};"
      STRIPE_TEST_SECRET_KEY: "${STRIPE_TEST_SECRET_KEY:-}"
      STRIPE_TEST_PUBLISHABLE_KEY: "${STRIPE_TEST_PUBLISHABLE_KEY:-}"
      STRIPE_TEST_WEBHOOK_SECRET: "${STRIPE_TEST_WEBHOOK_SECRET:-}"
      STRIPE_LIVE_SECRET_KEY: "${STRIPE_LIVE_SECRET_KEY:-}"
      STRIPE_LIVE_PUBLISHABLE_KEY: "${STRIPE_LIVE_PUBLISHABLE_KEY:-}"
      STRIPE_LIVE_WEBHOOK_SECRET: "${STRIPE_LIVE_WEBHOOK_SECRET:-}"
      STRIPE_CHECKOUT_SUCCESS_URL: "${STRIPE_CHECKOUT_SUCCESS_URL:-petmagic://checkout/success?session_id={CHECKOUT_SESSION_ID}}"
      STRIPE_CHECKOUT_CANCEL_URL: "${STRIPE_CHECKOUT_CANCEL_URL:-petmagic://checkout/cancel}"
      STRIPE_BILLING_PORTAL_RETURN_URL: "${STRIPE_BILLING_PORTAL_RETURN_URL:-}"
      GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL: "${GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL:-}"
      GOOGLE_PLAY_PRIVATE_KEY_PEM: "${GOOGLE_PLAY_PRIVATE_KEY_PEM:-}"
      GOOGLE_PLAY_ENVIRONMENT: "${GOOGLE_PLAY_ENVIRONMENT:-production}"
      GOOGLE_PLAY_PUBSUB_AUDIENCE: "${GOOGLE_PLAY_PUBSUB_AUDIENCE:-}"
      GOOGLE_PLAY_PUBSUB_EXPECTED_EMAIL: "${GOOGLE_PLAY_PUBSUB_EXPECTED_EMAIL:-}"
      APP_STORE_SHARED_SECRET: "${APP_STORE_SHARED_SECRET:-}"
      APP_STORE_ENVIRONMENT: "${APP_STORE_ENVIRONMENT:-production}"
      STORE_ACCOUNT_BINDING_MODE: "${STORE_ACCOUNT_BINDING_MODE:-compatibility}"
      ECONOMY_RECONCILIATION_ENABLED: "false"
      ECONOMY_PUSH_OUTBOX_DISPATCHER_ENABLED: "false"
      FAL_AI_API_KEY: "${FAL_AI_API_KEY:-}"
      FAL_WEBHOOK_URL: "${FAL_WEBHOOK_URL:-}"
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
      R2_ACCESS_KEY: "${R2_ACCESS_KEY:-}"
      R2_SECRET_KEY: "${R2_SECRET_KEY:-}"
      R2_BUCKET_NAME: "${R2_BUCKET_NAME:-}"
      R2_PUBLIC_URL: "${R2_PUBLIC_URL:-}"
      Templates__PublicBaseUrl: "${BACKEND_PUBLIC_BASE_URL:?BACKEND_PUBLIC_BASE_URL is required for public template media URLs}"
      Templates__StorageProvider: "${TEMPLATES_STORAGE_PROVIDER:?Set TEMPLATES_STORAGE_PROVIDER to R2 or Local explicitly}"
      Templates__AiProvider: "${TEMPLATES_AI_PROVIDER:?Set TEMPLATES_AI_PROVIDER to Fal or Fake explicitly}"
      Templates__Watermark__Enabled: "${TEMPLATES_WATERMARK_ENABLED:-false}"
      PETMAGIC_LOCAL_SMOKE_FAST_FAKE_COMPLETION: "${PETMAGIC_LOCAL_SMOKE_FAST_FAKE_COMPLETION:?Set PETMAGIC_LOCAL_SMOKE_FAST_FAKE_COMPLETION to false for production or true only for local smoke}"
      Templates__GenerationWorkerEnabled: "true"
      Templates__MediaCleanupWorkerEnabled: "false"
      Templates__TemplateOfTheDayAutoPickWorkerEnabled: "false"
      Templates__MaxConcurrentJobsPerWorker: "${GENERATION_WORKER_MAX_CONCURRENT_JOBS:-1}"
      Templates__GenerationWorkerPollIntervalMilliseconds: "${GENERATION_WORKER_POLL_INTERVAL_MS:-500}"
      Templates__GlobalMaxConcurrentGenerations: "${GENERATION_GLOBAL_MAX_CONCURRENT:-3}"
      Templates__ImageReservedConcurrentGenerations: "${GENERATION_IMAGE_RESERVED_CONCURRENT:-0}"
      Templates__ImageMaxConcurrentGenerations: "${GENERATION_IMAGE_MAX_CONCURRENT:-2}"
      Templates__ImageProtectedConcurrentGenerations: "${GENERATION_IMAGE_PROTECTED_CONCURRENT:-0}"
      Templates__VideoReservedConcurrentGenerations: "${GENERATION_VIDEO_RESERVED_CONCURRENT:-0}"
      Templates__VideoMaxConcurrentGenerations: "${GENERATION_VIDEO_MAX_CONCURRENT:-1}"
      Templates__VideoBorrowMaxConcurrentGenerations: "${GENERATION_VIDEO_BORROW_MAX_CONCURRENT:-0}"
      Templates__EnableElasticLaneBorrowing: "${GENERATION_ENABLE_ELASTIC_LANE_BORROWING:-false}"
      Templates__AllowVideoBorrowWhenImageQueueEmpty: "${GENERATION_ALLOW_VIDEO_BORROW_WHEN_IMAGE_QUEUE_EMPTY:-true}"
      Templates__AllowVideoBorrowWhenImageEstimatedWaitBelowSeconds: "${GENERATION_ALLOW_VIDEO_BORROW_IMAGE_WAIT_BELOW_SECONDS:-120}"
      Templates__VideoBorrowReleaseMode: "${GENERATION_VIDEO_BORROW_RELEASE_MODE:-natural_completion}"
      Templates__BorrowedVideoMaxAgeSeconds: "${GENERATION_BORROWED_VIDEO_MAX_AGE_SECONDS:-0}"
      Templates__BorrowingPriorityTiers: "${GENERATION_BORROWING_PRIORITY_TIERS:-premium,privileged,admin,free}"
      Templates__VideoPreprocessingMaxConcurrentGenerations: "${GENERATION_VIDEO_PREPROCESSING_MAX_CONCURRENT:-1}"
      Templates__FalProviderConcurrencyLimit: "${FAL_PROVIDER_CONCURRENCY_LIMIT:-0}"
      Templates__FalProviderReservedConcurrency: "${FAL_PROVIDER_RESERVED_CONCURRENCY:-1}"
      Templates__FalProviderBalanceLowThresholdUsd: "${FAL_PROVIDER_BALANCE_LOW_THRESHOLD_USD:-100}"
      Templates__FalProviderBalanceCriticalThresholdUsd: "${FAL_PROVIDER_BALANCE_CRITICAL_THRESHOLD_USD:-25}"
      Templates__FalProviderSpendDailyLimitUsd: "${FAL_PROVIDER_SPEND_DAILY_LIMIT_USD:-0}"
      Templates__MaxAiProviderRequestsPerMinute: "${GENERATION_PROVIDER_MAX_RPM:-60}"
      Templates__MaxGenerationAttempts: "${GENERATION_MAX_ATTEMPTS:-3}"
      Templates__RefundRetryDelayMilliseconds: "${GENERATION_REFUND_RETRY_DELAY_MS:-30000}"
      Templates__JobLockTimeoutMilliseconds: "${GENERATION_JOB_LOCK_TIMEOUT_MS:-900000}"
      Templates__OrphanQueuedJobTimeoutMilliseconds: "${GENERATION_ORPHAN_QUEUED_TIMEOUT_MS:-120000}"
      Templates__QueueMaxSize: "${GENERATION_QUEUE_MAX_SIZE:-1000}"
      Templates__EstimatedVideoGenerationSeconds: "${GENERATION_ESTIMATED_VIDEO_SECONDS:-420}"
      Templates__EstimatedImageGenerationSeconds: "${GENERATION_ESTIMATED_IMAGE_SECONDS:-90}"
      Templates__EstimatedVideoPreprocessingSeconds: "${GENERATION_ESTIMATED_VIDEO_PREPROCESSING_SECONDS:-90}"
      Templates__FreeImageMaxEstimatedWaitSeconds: "${GENERATION_FREE_IMAGE_MAX_WAIT_SECONDS:-1800}"
      Templates__PremiumImageMaxEstimatedWaitSeconds: "${GENERATION_PREMIUM_IMAGE_MAX_WAIT_SECONDS:-900}"
      Templates__PrivilegedImageMaxEstimatedWaitSeconds: "${GENERATION_PRIVILEGED_IMAGE_MAX_WAIT_SECONDS:-900}"
      Templates__FreeVideoMaxEstimatedWaitSeconds: "${GENERATION_FREE_VIDEO_MAX_WAIT_SECONDS:-3600}"
      Templates__PremiumVideoMaxEstimatedWaitSeconds: "${GENERATION_PREMIUM_VIDEO_MAX_WAIT_SECONDS:-1800}"
      Templates__PrivilegedVideoMaxEstimatedWaitSeconds: "${GENERATION_PRIVILEGED_VIDEO_MAX_WAIT_SECONDS:-1800}"
      Templates__QueuePriorityAgingIntervalSeconds: "${GENERATION_PRIORITY_AGING_INTERVAL_SECONDS:-60}"
      Templates__QueuePriorityAgingBoost: "${GENERATION_PRIORITY_AGING_BOOST:-500}"
      Templates__CancelQueuedGenerationEnabled: "${GENERATION_CANCEL_QUEUED_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    volumes:
      - backend_template_media:/app/wwwroot/templates-media
    healthcheck:
      test: [ "CMD-SHELL", "test -r /proc/1/cmdline && tr '\\0' ' ' </proc/1/cmdline | grep -q 'PetMagic.Host.GenerationWorker.dll'" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - petmagic-network

  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required for admin web build}"
        INTERNAL_API_BASE_URL: "${INTERNAL_API_BASE_URL:?INTERNAL_API_BASE_URL is required for admin web build}"
        ALLOW_LOCALHOST_API_BASE_URL_IN_PRODUCTION: "${ADMIN_WEB_ALLOW_LOCALHOST_API_BASE_URL_IN_PRODUCTION:-false}"
        NEXT_PUBLIC_ALLOW_LOCALHOST_API_BASE_URL_IN_PRODUCTION: "${ADMIN_WEB_ALLOW_LOCALHOST_API_BASE_URL_IN_PRODUCTION:-false}"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required for admin web runtime}"
      INTERNAL_API_BASE_URL: "${INTERNAL_API_BASE_URL:?INTERNAL_API_BASE_URL is required for admin web runtime}"
      ALLOW_LOCALHOST_API_BASE_URL_IN_PRODUCTION: "${ADMIN_WEB_ALLOW_LOCALHOST_API_BASE_URL_IN_PRODUCTION:-false}"
      NEXT_PUBLIC_ALLOW_LOCALHOST_API_BASE_URL_IN_PRODUCTION: "${ADMIN_WEB_ALLOW_LOCALHOST_API_BASE_URL_IN_PRODUCTION:-false}"
    ports:
      - "${ADMIN_WEB_HOST_PORT:-3000}:3000"
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"const http=require('node:http');const req=http.get('http://127.0.0.1:3000/ru',res=>{res.resume();process.exit(res.statusCode>=200&&res.statusCode<500?0:1);});req.on('error',()=>process.exit(1));req.setTimeout(5000,()=>{req.destroy();process.exit(1);});\"" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      - backend
    networks:
      - petmagic-network

  otel-collector:
    image: petmagic-otel-collector:local
    build:
      context: ./deploy/monitoring/otel-collector
    profiles: ["monitoring"]
    command: ["--config=/etc/otelcol/config.yaml"]
    restart: unless-stopped
    depends_on:
      - tempo
    networks:
      - petmagic-network

  tempo:
    image: petmagic-tempo:local
    build:
      context: ./deploy/monitoring/tempo
    profiles: ["monitoring"]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    restart: unless-stopped
    volumes:
      - tempo_data:/var/tempo
    ports:
      - "${TEMPO_HOST_PORT:-3200}:3200"
    networks:
      - petmagic-network

  prometheus:
    image: petmagic-prometheus:local
    build:
      context: ./deploy/monitoring/prometheus
    profiles: ["monitoring"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    depends_on:
      - otel-collector
      - alertmanager
    networks:
      - petmagic-network

  alertmanager:
    image: petmagic-alertmanager:local
    build:
      context: ./deploy/monitoring/alertmanager
    profiles: ["monitoring"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        escaped_url=$$(printf '%s' "$$ALERTMANAGER_WEBHOOK_URL" | sed 's/[\/&]/\\&/g');
        sed "s|__ALERTMANAGER_WEBHOOK_URL__|$$escaped_url|g" /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml;
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    restart: unless-stopped
    environment:
      ALERTMANAGER_WEBHOOK_URL: "${ALERTMANAGER_WEBHOOK_URL:?Set ALERTMANAGER_WEBHOOK_URL in .env}"
    volumes:
      - alertmanager_data:/alertmanager
    ports:
      - "${ALERTMANAGER_HOST_PORT:-9093}:9093"
    networks:
      - petmagic-network

  grafana:
    image: petmagic-grafana:local
    build:
      context: ./deploy/monitoring/grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - tempo
    networks:
      - petmagic-network

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local
  tempo_data:
    driver: local
  grafana_data:
    driver: local
  backend_data_protection:
    driver: local
  backend_support_attachments:
    driver: local
  backend_user_avatars:
    driver: local
  backend_template_media:
    driver: local

networks:
  petmagic-network:
    driver: bridge
