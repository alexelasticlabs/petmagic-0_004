services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: petmagic_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: petmagic_db
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U petmagic_user -d petmagic_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - petmagic-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_HTTP_PORTS: 5000
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=petmagic_db;Username=petmagic_user;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env. Generate with openssl rand -base64 64}"
      Jwt__Issuer: petmagic.app
      Jwt__Audience: petmagic-admin
      DataProtection__CertificatePassword: "${DATA_PROTECTION_CERTIFICATE_PASSWORD:-}"
      BootstrapAdmin__Email: "${BOOTSTRAP_ADMIN_EMAIL:-admin@petmagic.app}"
      BootstrapAdmin__Password: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      BootstrapAdmin__DisplayName: "${BOOTSTRAP_ADMIN_DISPLAY_NAME:-PetMagic Admin}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_AUDIENCES: "${GOOGLE_AUDIENCES:-}"
      APPLE_CLIENT_ID: "${APPLE_CLIENT_ID:-}"
      APPLE_CLIENT_SECRET: "${APPLE_CLIENT_SECRET:-}"
      APPLE_AUDIENCES: "${APPLE_AUDIENCES:-}"
      APPLE_AUTHORIZATION_ENDPOINT: "${APPLE_AUTHORIZATION_ENDPOINT:-}"
      APPLE_TOKEN_ENDPOINT: "${APPLE_TOKEN_ENDPOINT:-}"
      EMAIL_HOST: "${EMAIL_HOST:-}"
      EMAIL_PORT: "${EMAIL_PORT:-2525}"
      EMAIL_USERNAME: "${EMAIL_USERNAME:-}"
      EMAIL_PASSWORD: "${EMAIL_PASSWORD:-}"
      EMAIL_USE_SSL: "${EMAIL_USE_SSL:-true}"
      EMAIL_FROM_ADDRESS: "${EMAIL_FROM_ADDRESS:-no-reply@petmagic.app}"
      EMAIL_FROM_NAME: "${EMAIL_FROM_NAME:-PetMagic}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_CHECKOUT_SUCCESS_URL: "${STRIPE_CHECKOUT_SUCCESS_URL:-petmagic://checkout/success?session_id={CHECKOUT_SESSION_ID}}"
      STRIPE_CHECKOUT_CANCEL_URL: "${STRIPE_CHECKOUT_CANCEL_URL:-petmagic://checkout/cancel}"
      STRIPE_BILLING_PORTAL_RETURN_URL: "${STRIPE_BILLING_PORTAL_RETURN_URL:-}"
      FAL_AI_API_KEY: "${FAL_AI_API_KEY:-}"
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
      R2_ACCESS_KEY: "${R2_ACCESS_KEY:-}"
      R2_SECRET_KEY: "${R2_SECRET_KEY:-}"
      R2_BUCKET_NAME: "${R2_BUCKET_NAME:-}"
      R2_PUBLIC_URL: "${R2_PUBLIC_URL:-}"
      Identity__AvatarStorage__PublicBaseUrl: "${BACKEND_PUBLIC_BASE_URL:?BACKEND_PUBLIC_BASE_URL is required for public backend media URLs}"
      SupportChat__AttachmentStorage__PublicBaseUrl: "${BACKEND_PUBLIC_BASE_URL:?BACKEND_PUBLIC_BASE_URL is required for public support attachment URLs}"
      Templates__PublicBaseUrl: "${BACKEND_PUBLIC_BASE_URL:?BACKEND_PUBLIC_BASE_URL is required for public template media URLs}"
      Templates__GenerationWorkerEnabled: "false"
      RateLimiting__Auth__PermitLimit: "${RATE_LIMIT_AUTH_PERMIT:-30}"
      RateLimiting__Economy__PermitLimit: "${RATE_LIMIT_ECONOMY_PERMIT:-60}"
      RateLimiting__Templates__PermitLimit: "${RATE_LIMIT_TEMPLATES_PERMIT:-90}"
      RateLimiting__GenerationCreate__PermitLimit: "${RATE_LIMIT_GENERATION_CREATE_PERMIT:-12}"
      RateLimiting__GenerationStatus__PermitLimit: "${RATE_LIMIT_GENERATION_STATUS_PERMIT:-180}"
      RateLimiting__SupportChat__PermitLimit: "${RATE_LIMIT_SUPPORT_CHAT_PERMIT:-60}"
      RateLimiting__Admin__PermitLimit: "${RATE_LIMIT_ADMIN_PERMIT:-120}"
      RateLimiting__Webhooks__PermitLimit: "${RATE_LIMIT_WEBHOOKS_PERMIT:-120}"
      RateLimiting__AuthRegister__PermitLimit: "${RATE_LIMIT_AUTH_REGISTER_PERMIT:-8}"
      RateLimiting__AuthPasswordReset__PermitLimit: "${RATE_LIMIT_AUTH_PASSWORD_RESET_PERMIT:-10}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://localhost:5000/health >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - backend_data_protection:/root/.aspnet/DataProtection-Keys
      - backend_support_attachments:/app/wwwroot/support-attachments
      - backend_user_avatars:/app/wwwroot/user-avatars
      - backend_template_media:/app/wwwroot/templates-media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - petmagic-network

  generation-worker:
    build:
      context: .
      dockerfile: Dockerfile.generation-worker
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      DOTNET_ENVIRONMENT: "${DOTNET_ENVIRONMENT:-${ASPNETCORE_ENVIRONMENT:-Production}}"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=petmagic_db;Username=petmagic_user;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};"
      FAL_AI_API_KEY: "${FAL_AI_API_KEY:-}"
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
      R2_ACCESS_KEY: "${R2_ACCESS_KEY:-}"
      R2_SECRET_KEY: "${R2_SECRET_KEY:-}"
      R2_BUCKET_NAME: "${R2_BUCKET_NAME:-}"
      R2_PUBLIC_URL: "${R2_PUBLIC_URL:-}"
      Templates__PublicBaseUrl: "${BACKEND_PUBLIC_BASE_URL:?BACKEND_PUBLIC_BASE_URL is required for public template media URLs}"
      Templates__GenerationWorkerEnabled: "true"
      Templates__MediaCleanupWorkerEnabled: "false"
      Templates__MaxConcurrentJobsPerWorker: "${GENERATION_WORKER_MAX_CONCURRENT_JOBS:-1}"
      Templates__GlobalMaxConcurrentGenerations: "${GENERATION_GLOBAL_MAX_CONCURRENT:-3}"
      Templates__MaxAiProviderRequestsPerMinute: "${GENERATION_PROVIDER_MAX_RPM:-60}"
      Templates__MaxGenerationAttempts: "${GENERATION_MAX_ATTEMPTS:-3}"
      Templates__JobLockTimeoutMilliseconds: "${GENERATION_JOB_LOCK_TIMEOUT_MS:-900000}"
      Templates__QueueMaxSize: "${GENERATION_QUEUE_MAX_SIZE:-1000}"
      Templates__EstimatedVideoGenerationSeconds: "${GENERATION_ESTIMATED_VIDEO_SECONDS:-120}"
      Templates__EstimatedImageGenerationSeconds: "${GENERATION_ESTIMATED_IMAGE_SECONDS:-60}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
    volumes:
      - backend_template_media:/app/wwwroot/templates-media
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - petmagic-network

  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required for admin web build}"
        INTERNAL_API_BASE_URL: "${INTERNAL_API_BASE_URL:?INTERNAL_API_BASE_URL is required for admin web build}"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required for admin web runtime}"
      INTERNAL_API_BASE_URL: "${INTERNAL_API_BASE_URL:?INTERNAL_API_BASE_URL is required for admin web runtime}"
    ports:
      - "${ADMIN_WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - petmagic-network

volumes:
  postgres_data:
    driver: local
  backend_data_protection:
    driver: local
  backend_support_attachments:
    driver: local
  backend_user_avatars:
    driver: local
  backend_template_media:
    driver: local

networks:
  petmagic-network:
    driver: bridge
